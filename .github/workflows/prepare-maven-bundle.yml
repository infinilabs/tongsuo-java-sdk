name: Prepare Maven Central Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.1.0)'
        required: true
        type: string
      group_id:
        description: 'Maven Group ID'
        required: true
        type: string
        default: 'com.infinilabs'

jobs:
  build-all-platforms:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            arch: linux-x86_64
            setup_qemu: false
          - platform: linux-aarch_64
            os: ubuntu-22.04
            arch: linux-aarch_64
            setup_qemu: true
          - platform: osx-x86_64
            os: macos-13
            arch: darwin64-x86_64
            setup_qemu: false
          - platform: osx-aarch_64
            os: macos-14
            arch: darwin64-arm64
            setup_qemu: false
          - platform: windows-x86_64
            os: windows-2022
            arch: VC-WIN64A
            setup_qemu: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up QEMU (Linux ARM64)
        if: matrix.setup_qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential perl patchelf
          if [[ "${{ matrix.arch }}" == "linux-aarch_64" ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install perl

      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install strawberryperl -y
          choco install nasm -y

      - name: Build Tongsuo
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch master https://github.com/Tongsuo-Project/Tongsuo.git
          cd Tongsuo
          
          if [[ "${{ runner.os }}" == "Linux" && "${{ matrix.arch }}" == "linux-aarch_64" ]]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
            ./config --prefix=$HOME/tongsuo --cross-compile-prefix=aarch64-linux-gnu- linux-aarch64 enable-ntls -static -Wl,--no-as-needed -ldl
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            ./config --prefix=$HOME/tongsuo enable-ntls -static -Wl,--no-as-needed -ldl
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            ./config --prefix=$HOME/tongsuo ${{ matrix.arch }} enable-ntls
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            perl Configure --prefix=$HOME/tongsuo ${{ matrix.arch }} enable-ntls
          fi
          
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)
          make install_sw
          
          echo "TONGSUO_HOME=$HOME/tongsuo" >> $GITHUB_ENV

      - name: Build JAR
        shell: bash
        run: |
          set -e
          
          # Set Maven group ID via property
          echo "mavenGroupId=${{ inputs.group_id }}" > gradle.properties
          echo "version=${{ inputs.version }}" >> gradle.properties
          
          ./gradlew -PcheckErrorQueue :tongsuo-openjdk:build

      - name: Prepare artifacts
        shell: bash
        run: |
          set -e
          mkdir -p artifacts/${{ matrix.platform }}
          
          # Find the built JAR
          JAR_FILE=$(find openjdk/build/libs -name "tongsuo-openjdk-*.jar" ! -name "*-javadoc.jar" ! -name "*-sources.jar" | head -1)
          SOURCES_JAR=$(find openjdk/build/libs -name "tongsuo-openjdk-*-sources.jar" | head -1)
          JAVADOC_JAR=$(find openjdk/build/libs -name "tongsuo-openjdk-*-javadoc.jar" | head -1)
          
          if [ -n "$JAR_FILE" ]; then
            cp "$JAR_FILE" "artifacts/${{ matrix.platform }}/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform }}.jar"
          fi
          
          if [ -n "$SOURCES_JAR" ]; then
            cp "$SOURCES_JAR" "artifacts/${{ matrix.platform }}/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform }}-sources.jar"
          fi
          
          if [ -n "$JAVADOC_JAR" ]; then
            cp "$JAVADOC_JAR" "artifacts/${{ matrix.platform }}/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform }}-javadoc.jar"
          fi

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts-${{ matrix.platform }}
          path: artifacts/${{ matrix.platform }}/*
          retention-days: 7

  build-uber-jars:
    name: Build Uber JARs
    needs: build-all-platforms
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: platform-jars
          pattern: maven-artifacts-*
          merge-multiple: true

      - name: Build static uber JAR
        run: |
          set -e
          
          mkdir -p uber-static/extract
          cd uber-static/extract
          
          # Extract all platform JARs
          for jar in ../../platform-jars/*.jar; do
            if [[ ! "$jar" =~ (sources|javadoc) ]]; then
              echo "Extracting $jar"
              jar xf "$jar"
            fi
          done
          
          # Create uber JAR
          cd ..
          jar cf "tongsuo-openjdk-${{ inputs.version }}-static-uber.jar" -C extract .
          
          echo "Static uber JAR created:"
          ls -lh *.jar

      - name: Build dynamic uber JAR  
        run: |
          set -e
          
          mkdir -p uber-dynamic/extract
          cd uber-dynamic/extract
          
          # Extract only Java classes (no native libs)
          for jar in ../../platform-jars/*.jar; do
            if [[ ! "$jar" =~ (sources|javadoc) ]]; then
              echo "Extracting classes from $jar"
              jar xf "$jar"
              # Remove native libraries
              rm -rf META-INF/native || true
            fi
          done
          
          # Create uber JAR
          cd ..
          jar cf "tongsuo-openjdk-${{ inputs.version }}-dynamic-uber.jar" -C extract .
          
          echo "Dynamic uber JAR created:"
          ls -lh *.jar

      - name: Upload uber JARs
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifacts-uber
          path: |
            uber-static/*.jar
            uber-dynamic/*.jar
          retention-days: 7

  create-maven-bundle:
    name: Create Maven Central Bundle
    needs: [build-all-platforms, build-uber-jars]
    runs-on: ubuntu-22.04
    env:
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '11'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: maven-artifacts-*

      - name: Prepare Maven bundle structure
        run: |
          set -e
          
          VERSION="${{ inputs.version }}"
          GROUP_ID="${{ inputs.group_id }}"
          ARTIFACT_ID="tongsuo-openjdk"
          GROUP_PATH=$(echo $GROUP_ID | tr '.' '/')
          
          BUNDLE_DIR="maven-bundle/$GROUP_PATH/$ARTIFACT_ID/$VERSION"
          mkdir -p "$BUNDLE_DIR"
          
          echo "Creating bundle in: $BUNDLE_DIR"
          
          # Function to sign a file
          sign_file() {
            local file=$1
            echo "Signing: $file"
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --armor --detach-sign "$file"
          }
          
          # Function to create checksums
          create_checksums() {
            local file=$1
            md5sum "$file" | cut -d' ' -f1 > "${file}.md5"
            sha1sum "$file" | cut -d' ' -f1 > "${file}.sha1"
          }
          
          # Generate POM for main artifact (using first platform's metadata)
          cat > "$BUNDLE_DIR/${ARTIFACT_ID}-${VERSION}.pom" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            
            <groupId>${{ inputs.group_id }}</groupId>
            <artifactId>tongsuo-openjdk</artifactId>
            <version>${{ inputs.version }}</version>
            <packaging>jar</packaging>
            
            <name>Tongsuo OpenJDK Provider</name>
            <description>Tongsuo Provider is an alternate Java Security Provider that uses Tongsuo</description>
            <url>https://www.tongsuo.net/</url>
            
            <licenses>
              <license>
                <name>Apache License, Version 2.0</name>
                <url>https://www.apache.org/licenses/LICENSE-2.0</url>
              </license>
            </licenses>
            
            <developers>
              <developer>
                <id>tongsuo</id>
                <name>Tongsuo Project Authors</name>
                <email>tongsuo-dev@tongsuo.net</email>
                <url>https://www.tongsuo.net/</url>
                <organization>Tongsuo Project</organization>
                <organizationUrl>https://github.com/Tongsuo-Project</organizationUrl>
              </developer>
            </developers>
            
            <scm>
              <connection>scm:git:https://github.com/Tongsuo-Project/tongsuo-java-sdk.git</connection>
              <developerConnection>scm:git:git@github.com:Tongsuo-Project/tongsuo-java-sdk.git</developerConnection>
              <url>https://github.com/Tongsuo-Project/tongsuo-java-sdk</url>
            </scm>
          </project>
          EOF
          
          # Process all artifacts
          for artifact_dir in all-artifacts/maven-artifacts-*; do
            platform=$(basename "$artifact_dir" | sed 's/maven-artifacts-//')
            echo "Processing platform: $platform"
            
            for file in "$artifact_dir"/*.jar; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                dest="$BUNDLE_DIR/$filename"
                
                cp "$file" "$dest"
                sign_file "$dest"
                create_checksums "$dest"
                create_checksums "${dest}.asc"
              fi
            done
          done
          
          # Sign and checksum POM
          sign_file "$BUNDLE_DIR/${ARTIFACT_ID}-${VERSION}.pom"
          create_checksums "$BUNDLE_DIR/${ARTIFACT_ID}-${VERSION}.pom"
          create_checksums "$BUNDLE_DIR/${ARTIFACT_ID}-${VERSION}.pom.asc"
          
          echo "Bundle structure:"
          find maven-bundle -type f | sort

      - name: Create bundle ZIP
        run: |
          cd maven-bundle
          zip -r "../tongsuo-openjdk-${{ inputs.version }}-maven-bundle.zip" .
          cd ..
          
          echo "Bundle ZIP created:"
          ls -lh tongsuo-openjdk-${{ inputs.version }}-maven-bundle.zip

      - name: Upload Maven bundle
        uses: actions/upload-artifact@v4
        with:
          name: maven-bundle
          path: tongsuo-openjdk-${{ inputs.version }}-maven-bundle.zip
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}-maven
          name: Maven Bundle ${{ inputs.version }}
          body: |
            ## Maven Central Bundle for version ${{ inputs.version }}
            
            **Group ID:** `${{ inputs.group_id }}`
            **Artifact ID:** `tongsuo-openjdk`
            **Version:** `${{ inputs.version }}`
            
            This bundle contains all platform-specific JARs and uber JARs ready for Maven Central publishing.
            
            ### Contents
            - Platform JARs: linux-x86_64, linux-aarch_64, osx-x86_64, osx-aarch_64, windows-x86_64
            - Static uber JAR (self-contained, ~15-20 MB)
            - Dynamic uber JAR (requires system Tongsuo, ~1-2 MB)
            - All JARs with GPG signatures (.asc) and checksums (.md5, .sha1)
            
            ### Publishing to Maven Central
            
            Download the bundle ZIP and use it with the [infinilabs/ci](https://github.com/infinilabs/ci) repository's `publish-maven-central.yml` workflow.
            
            ```bash
            # In infinilabs/ci repository
            # Trigger the workflow with:
            # - Component: tongsuo-openjdk
            # - Version: ${{ inputs.version }}
            # - Bundle ZIP path
            ```
          files: tongsuo-openjdk-${{ inputs.version }}-maven-bundle.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
