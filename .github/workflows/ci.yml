name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'

permissions:
  contents: write

env:
  # Define the Tongsuo reference version once
  TONGSUO_VERSION: 8.4-stable

jobs:
  # ==================================================================================
  # Phase 1: Prepare Source Code
  # ==================================================================================
  prepare-source:
    name: Prepare Source
    runs-on: ubuntu-latest
    steps:
      - name: Clone Tongsuo Repository
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      - name: Archive Tongsuo Source
        uses: actions/upload-artifact@v6
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo

  # ==================================================================================
  # Phase 2: Static Build & Test
  # ==================================================================================
  ci-static:
    name: Static - ${{ matrix.platform.name }}
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04,     target: linux-x86_64,      name: Linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64,     name: Linux-ARM64 }
          - { os: macos-14,         target: darwin64-x86_64,   name: macOS-x64, use_qemu: true }
          - { os: macos-14,         target: darwin64-arm64,    name: macOS-ARM64 }
          - { os: windows-latest,   target: VC-WIN64A,         name: Windows-x64 }
          - { os: ubuntu-24.04,     target: VC-WIN64-ARM,      name: Windows-ARM64, cross_compile: true }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    
    steps:
      - name: Show System Architecture
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "System Architecture Information"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Runner OS: ${{ runner.os }}"
          echo "Platform target: ${{ matrix.platform.target }}"
          echo "Platform name: ${{ matrix.platform.name }}"
          echo ""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "macOS Architecture (uname -m): $(uname -m)"
            echo "macOS Architecture (arch): $(arch)"
            echo "Available architectures:"
            lipo -info $(which clang) 2>/dev/null || echo "  clang: $(file $(which clang))"
            echo ""
            echo "Java version and architecture:"
            java -version 2>&1
            file $(which java)
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "Linux Architecture (uname -m): $(uname -m)"
            echo "CPU info:"
            lscpu | grep -E "Architecture|Model name" || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "Windows Architecture:"
            systeminfo | findstr /B /C:"System Type" || echo "N/A"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Set Environment Variables
        shell: bash
        run: |
          echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV
          
          # Set architecture-specific flags for macOS
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
              # Cross-compilation for x86_64 on ARM runners with Rosetta 2
              echo "CC=clang -arch x86_64" >> $GITHUB_ENV
              echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
              echo "CFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "CXXFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "LDFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_ldFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cppFlags=-arch x86_64" >> $GITHUB_ENV
            elif [[ "${{ matrix.platform.target }}" == "darwin64-arm64" ]]; then
              # Native ARM64 build - macos-14 is ARM64 by default, no flags needed
              echo "Building natively for ARM64"
            fi
          fi

      - name: Set up Rosetta 2 for x86_64 emulation (macOS)
        if: runner.os == 'macOS' && matrix.platform.use_qemu == true
        shell: bash
        run: |
          # Rosetta 2 is already installed on macOS ARM runners
          # Verify it's available
          if ! arch -x86_64 uname -m; then
            echo "Installing Rosetta 2..."
            softwareupdate --install-rosetta --agree-to-license
          fi
          echo "Rosetta 2 is available"

      - name: Set up llvm-mingw for Windows ARM64 cross-compilation
        if: matrix.platform.cross_compile == true && matrix.platform.target == 'VC-WIN64-ARM'
        shell: bash
        run: |
          echo "Installing llvm-mingw toolchain for ARM64..."
          
          # Download and install llvm-mingw (supports ARM64)
          LLVM_MINGW_VERSION="20231128"
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          
          wget -q "${LLVM_MINGW_URL}" -O /tmp/llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          rm /tmp/llvm-mingw.tar.xz
          
          # Add to PATH
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH
          export PATH="/opt/llvm-mingw/bin:$PATH"
          
          # Set environment variables for cross-compilation
          echo "CC=aarch64-w64-mingw32-clang" >> $GITHUB_ENV
          echo "CXX=aarch64-w64-mingw32-clang++" >> $GITHUB_ENV
          echo "AR=aarch64-w64-mingw32-ar" >> $GITHUB_ENV
          echo "RANLIB=aarch64-w64-mingw32-ranlib" >> $GITHUB_ENV
          
          # Verify installation
          aarch64-w64-mingw32-clang --version
          echo "llvm-mingw ARM64 toolchain installed successfully"

      - name: Set up Rosetta (x86_64 for macOS x64)
        if: runner.os == 'macOS' && matrix.platform.use_qemu == true
        shell: bash
        run: |
          # Rosetta 2 is already installed on macOS ARM runners
          # Verify it's available
          if ! arch -x86_64 uname -m; then
            echo "Installing Rosetta 2..."
            softwareupdate --install-rosetta --agree-to-license
          fi
          echo "Rosetta 2 is available"

      - name: Set up JDK 11 (x86_64 for macOS x64)
        if: runner.os == 'macOS' && matrix.platform.target == 'darwin64-x86_64'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - name: Set up JDK 11 (default)
        if: "(runner.os != 'macOS' || matrix.platform.target != 'darwin64-x86_64') && (matrix.platform.cross_compile != true)"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - uses: actions/checkout@v6

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v7
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo
        continue-on-error: true
        id: download_artifact

      - name: Clone Tongsuo Directly (Fallback for Windows)
        if: steps.download_artifact.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Unix: Linux / macOS)
      # -----------------------------------------------------------
      - name: Build Tongsuo Static (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          # Fix permissions
          chmod +x Configure config
          
          # Determine configuration target
          CONFIG_TARGET="${{ matrix.platform.target }}"
          CONFIG_ARGS=""
          
          # For Windows ARM64 cross-compilation on Linux, use mingw64
          if [[ "${{ matrix.platform.cross_compile }}" == "true" && "${{ matrix.platform.target }}" == "VC-WIN64-ARM" ]]; then
            CONFIG_TARGET="mingw64"
            CONFIG_ARGS="--cross-compile-prefix=aarch64-w64-mingw32- no-asm"
            export CFLAGS="$CFLAGS -D_WIN32_WINNT=0x0A00"
            # Clear CC to prevent double-prefix (Configure will add prefix automatically)
            unset CC CXX AR RANLIB
            # Remove --strict-warnings to avoid -Werror issues with clang
            STRICT_WARNINGS=""
            echo "Using mingw64 configuration for Windows ARM64 cross-compilation"
          else
            STRICT_WARNINGS="--strict-warnings"
          fi
          
          echo "Configuring ${CONFIG_TARGET}..."
          ./Configure ${CONFIG_TARGET} \
            --prefix=$TONGSUO_HOME \
            --libdir=$TONGSUO_HOME/lib \
            enable-weak-ssl-ciphers enable-ntls no-shared \
            ${STRICT_WARNINGS} --release -fstack-protector-strong \
            ${CONFIG_ARGS}
            
          echo "Building..."
          # For Windows ARM64, build libs first (apps will fail due to resource file issue, but libs are OK)
          if [[ "${{ matrix.platform.cross_compile }}" == "true" && "${{ matrix.platform.target }}" == "VC-WIN64-ARM" ]]; then
            # Build only crypto and ssl libraries, not programs
            # First generate all headers, then build libraries (avoid parallel build race)
            make build_generated
            make -j4 libcrypto.a libssl.a
            # Check if libraries were built successfully
            if [[ -f libcrypto.a && -f libssl.a ]]; then
              echo "✅ Libraries built successfully"
              # Manually install just the libraries
              echo "Installing libraries..."
              mkdir -p $TONGSUO_HOME/lib $TONGSUO_HOME/include
              cp -r include/openssl $TONGSUO_HOME/include/
              cp libcrypto.a $TONGSUO_HOME/lib/
              cp libssl.a $TONGSUO_HOME/lib/
              echo "Windows ARM64 static libraries installed successfully"
              ls -lh $TONGSUO_HOME/lib/
            else
              echo "❌ Library build failed"
              exit 1
            fi
          else
            make -s -j4
            echo "Installing..."
            make install
          fi

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Windows)
      # -----------------------------------------------------------
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.target == 'VC-WIN64-ARM' && 'amd64_arm64' || 'amd64' }}
          
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows' && matrix.platform.target == 'VC-WIN64A'
        
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo Static (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          
          Write-Host "Configuring ${{ matrix.platform.target }}..."
          perl .\Configure ${{ matrix.platform.target }} `
            --prefix=$Env:TONGSUO_HOME `
            no-capieng no-makedepend `
            enable-weak-ssl-ciphers enable-ntls no-shared --release
          
          Write-Host "Building..."
          nmake /S
          
          Write-Host "Installing..."
          nmake install

      # -----------------------------------------------------------
      # Gradle Build & Test
      # -----------------------------------------------------------
      - name: Setup Gradle Repository Override
        shell: bash
        run: |
          # Create init.gradle to override repositories with official Maven Central
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITGRADLE'
          allprojects {
            buildscript {
              repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
              }
            }
            repositories {
              google()
              mavenCentral()
            }
          }
          INITGRADLE
          echo "Created Gradle init script to use official repositories"

      - name: Gradle Check
        # Skip Java SDK build for Windows ARM64 (cross-compilation issues)
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          GRADLE_ARGS=""
          GRADLE_CMD="./gradlew"
          
          # For macOS x86_64 on ARM, use Rosetta 2 to run x86_64 JDK
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
            GRADLE_ARGS="-Parch=x86_64 -PldFlags=\"-arch x86_64\" -PcFlags=\"-arch x86_64\" -PcppFlags=\"-arch x86_64\""
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
          fi
          
          # For macOS ARM64, let it build natively (no special flags needed)
          # The JDK and toolchain will be ARM64 by default on macos-14

          # Add arch parameter for Windows ARM64
          if [[ "${{ matrix.platform.target }}" == "VC-WIN64-ARM" ]]; then
            GRADLE_ARGS="-Parch=arm64"
          fi
          
          # Add Tongsuo to PATH for Windows
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
          fi
          
          echo "Running Gradle check with args: $GRADLE_ARGS..."
          eval $GRADLE_CMD check -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS

      - name: Verify Windows ARM64 Build
        if: matrix.platform.target == 'VC-WIN64-ARM' && matrix.platform.cross_compile == true
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  Windows ARM64 Build Status (Cross-compiled on Linux)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Verify Tongsuo libraries exist
          libPath="$TONGSUO_HOME/lib"
          libCrypto="$libPath/libcrypto.a"
          libSsl="$libPath/libssl.a"
          
          if [[ -f "$libCrypto" && -f "$libSsl" ]]; then
            echo "✅ Tongsuo C libraries built successfully:"
            ls -lh "$libCrypto"
            ls -lh "$libSsl"
            
            # Verify ARM64 architecture
            echo ""
            echo "Library Architecture Verification:"
            file "$libCrypto" "$libSsl"
          else
            echo "❌ Tongsuo libraries not found at:"
            echo "   $libCrypto"
            echo "   $libSsl"
            echo ""
            echo "Contents of $TONGSUO_HOME:"
            ls -laR "$TONGSUO_HOME" || true
            exit 1
          fi
          
          echo ""
          echo "✅ C libraries ready for Java SDK build"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Build Test JAR (Linux x64 Only)
        if: matrix.platform.target == 'linux-x86_64'
        shell: bash
        run: ./gradlew :tongsuo-openjdk:testJar -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME

      # -----------------------------------------------------------
      # Artifacts & Logs
      # -----------------------------------------------------------
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-static-${{ matrix.platform.name }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log
          if-no-files-found: ignore

      - name: Upload Test JAR
        if: matrix.platform.target == 'linux-x86_64'
        uses: actions/upload-artifact@v6
        with:
          name: jar-static-${{ matrix.platform.name }}
          path: openjdk/build/libs/tongsuo-openjdk-*.jar
          if-no-files-found: ignore

  # ==================================================================================
  # Phase 3: Dynamic Build & Test
  # ==================================================================================
  ci-dynamic:
    name: Dynamic - ${{ matrix.platform.name }}
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04,     target: linux-x86_64,      name: Linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64,     name: Linux-ARM64 }
          - { os: macos-14,         target: darwin64-x86_64,   name: macOS-x64, use_qemu: true }
          - { os: macos-14,         target: darwin64-arm64,    name: macOS-ARM64 }
          - { os: windows-latest,   target: VC-WIN64A,         name: Windows-x64 }
          - { os: ubuntu-24.04,     target: VC-WIN64-ARM,      name: Windows-ARM64, cross_compile: true }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    
    steps:
      - name: Show System Architecture
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "System Architecture Information"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Runner OS: ${{ runner.os }}"
          echo "Platform target: ${{ matrix.platform.target }}"
          echo "Platform name: ${{ matrix.platform.name }}"
          echo ""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "macOS Architecture (uname -m): $(uname -m)"
            echo "macOS Architecture (arch): $(arch)"
            echo "Available architectures:"
            lipo -info $(which clang) 2>/dev/null || echo "  clang: $(file $(which clang))"
            echo ""
            echo "Java version and architecture:"
            java -version 2>&1
            file $(which java)
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "Linux Architecture (uname -m): $(uname -m)"
            echo "CPU info:"
            lscpu | grep -E "Architecture|Model name" || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "Windows Architecture:"
            systeminfo | findstr /B /C:"System Type" || echo "N/A"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Set Environment Variables
        shell: bash
        run: |
          echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV
          
          # Set architecture-specific flags for macOS
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
              # Cross-compilation for x86_64 on ARM runners with Rosetta 2
              echo "CC=clang -arch x86_64" >> $GITHUB_ENV
              echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
              echo "CFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "CXXFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "LDFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_ldFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cppFlags=-arch x86_64" >> $GITHUB_ENV
            elif [[ "${{ matrix.platform.target }}" == "darwin64-arm64" ]]; then
              # Native ARM64 build - macos-14 is ARM64 by default, no flags needed
              echo "Building natively for ARM64"
            fi
          fi

      - name: Set up Rosetta 2 for x86_64 emulation (macOS)
        if: runner.os == 'macOS' && matrix.platform.use_qemu == true
        shell: bash
        run: |
          # Rosetta 2 is already installed on macOS ARM runners
          # Verify it's available
          if ! arch -x86_64 uname -m; then
            echo "Installing Rosetta 2..."
            softwareupdate --install-rosetta --agree-to-license
          fi
          echo "Rosetta 2 is available"

      - name: Set up llvm-mingw for Windows ARM64 cross-compilation
        if: matrix.platform.cross_compile == true && matrix.platform.target == 'VC-WIN64-ARM'
        shell: bash
        run: |
          echo "Installing llvm-mingw toolchain for ARM64..."
          
          # Download and install llvm-mingw (supports ARM64)
          LLVM_MINGW_VERSION="20231128"
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          
          wget -q "${LLVM_MINGW_URL}" -O /tmp/llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          rm /tmp/llvm-mingw.tar.xz
          
          # Add to PATH (Configure will use --cross-compile-prefix)
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH
          export PATH="/opt/llvm-mingw/bin:$PATH"
          
          # Verify installation
          aarch64-w64-mingw32-clang --version
          echo "llvm-mingw ARM64 toolchain installed successfully"

      - name: Set up JDK 11 (x86_64 for macOS x64)
        if: runner.os == 'macOS' && matrix.platform.target == 'darwin64-x86_64'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - name: Set up JDK 11 (default)
        if: "(runner.os != 'macOS' || matrix.platform.target != 'darwin64-x86_64') && (matrix.platform.cross_compile != true)"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - uses: actions/checkout@v6

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v7
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo
        continue-on-error: true
        id: download_artifact

      - name: Clone Tongsuo Directly (Fallback for Windows)
        if: steps.download_artifact.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Unix Dynamic)
      # -----------------------------------------------------------
      - name: Build Tongsuo Dynamic (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          # Fix permissions
          chmod +x Configure config
          
          # Determine configuration target
          CONFIG_TARGET="${{ matrix.platform.target }}"
          CONFIG_ARGS=""
          
          # For Windows ARM64 cross-compilation on Linux, use mingw64
          if [[ "${{ matrix.platform.cross_compile }}" == "true" && "${{ matrix.platform.target }}" == "VC-WIN64-ARM" ]]; then
            CONFIG_TARGET="mingw64"
            # Use no-shared for ARM64 to avoid DLL resource file issues
            CONFIG_ARGS="--cross-compile-prefix=aarch64-w64-mingw32- no-asm no-shared"
            export CFLAGS="$CFLAGS -D_WIN32_WINNT=0x0A00"
            # Clear CC to prevent double-prefix (Configure will add prefix automatically)
            unset CC CXX AR RANLIB
            # Remove --strict-warnings to avoid -Werror issues with clang
            STRICT_WARNINGS=""
            echo "Using mingw64 configuration for Windows ARM64 cross-compilation (static libs only)"
          else
            STRICT_WARNINGS="--strict-warnings"
          fi
          
          echo "Configuring ${CONFIG_TARGET} (dynamic)..."
          ./Configure ${CONFIG_TARGET} \
            --prefix=$TONGSUO_HOME \
            --libdir=$TONGSUO_HOME/lib \
            enable-weak-ssl-ciphers enable-ntls \
            ${STRICT_WARNINGS} --release \
            ${CONFIG_ARGS}
            
          echo "Building..."
          # For Windows ARM64, use static libs (DLL has resource file issues)
          if [[ "${{ matrix.platform.cross_compile }}" == "true" && "${{ matrix.platform.target }}" == "VC-WIN64-ARM" ]]; then
            # Build only crypto and ssl libraries, not programs
            # First generate all headers, then build libraries (avoid parallel build race)
            make build_generated
            make -j4 libcrypto.a libssl.a
            # Check if libraries were built successfully
            if [[ -f libcrypto.a && -f libssl.a ]]; then
              echo "✅ Libraries built successfully"
              # Manually install just the libraries
              echo "Installing libraries..."
              mkdir -p $TONGSUO_HOME/lib $TONGSUO_HOME/include
              cp -r include/openssl $TONGSUO_HOME/include/
              cp libcrypto.a $TONGSUO_HOME/lib/
              cp libssl.a $TONGSUO_HOME/lib/
              echo "Windows ARM64 static libraries installed successfully"
              ls -lh $TONGSUO_HOME/lib/
            else
              echo "❌ Library build failed"
              exit 1
            fi
          else
            make -s -j4
            echo "Installing..."
            make install
          fi

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Windows Dynamic)
      # -----------------------------------------------------------
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.target == 'VC-WIN64-ARM' && 'amd64_arm64' || 'amd64' }}
          
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows' && matrix.platform.target == 'VC-WIN64A'
        
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo Dynamic (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          
          Write-Host "Configuring ${{ matrix.platform.target }} (dynamic)..."
          perl .\Configure ${{ matrix.platform.target }} `
            --prefix=$Env:TONGSUO_HOME `
            no-capieng no-makedepend `
            enable-weak-ssl-ciphers enable-ntls --release
          
          Write-Host "Building..."
          nmake /S
          
          Write-Host "Installing..."
          nmake install

      # -----------------------------------------------------------
      # Gradle Build & Test (Dynamic)
      # -----------------------------------------------------------
      - name: Set PATH for Dynamic Libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$TONGSUO_HOME/bin" >> $GITHUB_PATH
          echo "$TONGSUO_HOME/lib" >> $GITHUB_PATH

      - name: Setup Gradle Repository Override
        shell: bash
        run: |
          # Create init.gradle to override repositories with official Maven Central
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITGRADLE'
          allprojects {
            buildscript {
              repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
              }
            }
            repositories {
              google()
              mavenCentral()
            }
          }
          INITGRADLE
          echo "Created Gradle init script to use official repositories"

      - name: Gradle Check
        shell: bash
        run: |
          GRADLE_ARGS=""
          TASK="check"
          GRADLE_CMD="./gradlew"
          
          # MacOS x86_64: Use Rosetta 2 to run x86_64 JDK and tests
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
            GRADLE_ARGS="-Parch=x86_64 -PldFlags=\"-arch x86_64\" -PcFlags=\"-arch x86_64\" -PcppFlags=\"-arch x86_64\""
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
            TASK="check"
            echo "✅ Running tests for macOS x86_64 using Rosetta 2 emulation"
          fi
          
          # For macOS ARM64, explicitly set arm64 architecture
          if [[ "${{ matrix.platform.target }}" == "darwin64-arm64" ]]; then
            GRADLE_ARGS="-Parch=arm64 -PldFlags=\"-arch arm64\" -PcFlags=\"-arch arm64\" -PcppFlags=\"-arch arm64\""
          fi
          
          # Windows Path
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
          fi
          
          echo "Running Gradle $TASK with args: $GRADLE_ARGS..."
          eval $GRADLE_CMD $TASK -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS

      - name: Verify Windows ARM64 Build (Dynamic)
        if: matrix.platform.target == 'VC-WIN64-ARM' && matrix.platform.cross_compile == true
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  Windows ARM64 Build Status (Dynamic, Cross-compiled)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Verify Tongsuo DLLs exist
          binPath="$TONGSUO_HOME/bin"
          libPath="$TONGSUO_HOME/lib"
          
          echo "Checking for DLL files in $binPath and $libPath..."
          find "$TONGSUO_HOME" -name "*.dll" -o -name "*.dll.a" | while read f; do
            echo "✅ Found: $f"
            ls -lh "$f"
            file "$f"
          done
          
          # Check if any DLLs were found
          dllCount=$(find "$TONGSUO_HOME" -name "*.dll" | wc -l)
          if [[ $dllCount -gt 0 ]]; then
            echo ""
            echo "✅ Tongsuo dynamic libraries built successfully"
          else
            echo ""
            echo "⚠️  No DLL files found, but this may be expected for cross-compilation"
            echo "   Listing all files in TONGSUO_HOME:"
            ls -laR "$TONGSUO_HOME" || true
          fi
          
          echo ""
          echo "✅ C libraries ready for Java SDK build"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Build Test JAR with Dynamic Lib Dep (Linux x64 Only)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export LD_LIBRARY_PATH=$TONGSUO_HOME/lib:$LD_LIBRARY_PATH
          ./gradlew :tongsuo-openjdk:testJar -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome=$TONGSUO_HOME

      # -----------------------------------------------------------
      # Error Handling
      # -----------------------------------------------------------
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-dynamic-${{ matrix.platform.name }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log
          if-no-files-found: ignore

      - name: Upload Test JAR
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: jar-dynamic-${{ matrix.platform.name }}
          path: openjdk/build/libs/tongsuo-openjdk-*.jar
          if-no-files-found: ignore