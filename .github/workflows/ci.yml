name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'

env:
  # Define the Tongsuo reference version once
  TONGSUO_REF: 8.4-stable

jobs:
  # ==================================================================================
  # Phase 1: Prepare Source Code
  # ==================================================================================
  prepare-source:
    name: Prepare Source
    runs-on: ubuntu-latest
    steps:
      - name: Clone Tongsuo Repository
        uses: actions/checkout@v4
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_REF }}
          path: Tongsuo

      - name: Archive Tongsuo Source
        uses: actions/upload-artifact@v4
        with:
          name: tongsuo-source
          path: ${{ github.workspace }}/Tongsuo

  # ==================================================================================
  # Phase 2: Static Build & Test
  # ==================================================================================
  ci-static:
    name: Static - ${{ matrix.os }}
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        os: 
          - ubuntu-24.04
          - ubuntu-24.04-arm  # Uncomment if your org has ARM runners
          - macos-14          # Apple Silicon (ARM64)
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    steps:
      - name: Set Environment Variables
        shell: bash
        run: echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11

      - uses: actions/checkout@v4

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v4
        with:
          name: tongsuo-source
          path: ${{ github.workspace }}/Tongsuo

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Unix: Linux / macOS)
      # -----------------------------------------------------------
      - name: Build Tongsuo Static (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          # Auto-detect target using ./Configure
          ./Configure --prefix=$TONGSUO_HOME --libdir=$TONGSUO_HOME/lib \
            enable-weak-ssl-ciphers enable-ntls no-shared \
            --strict-warnings --release -fstack-protector-strong > configure.log 2>&1
            
          make -s -j4 > build.log 2>&1
          make install >> build.log 2>&1

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Windows)
      # -----------------------------------------------------------
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo Static (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          perl .\Configure --prefix=$Env:TONGSUO_HOME no-capieng no-makedepend enable-weak-ssl-ciphers enable-ntls no-shared --release
          nmake /S
          nmake install

      # -----------------------------------------------------------
      # Gradle Build & Test
      # -----------------------------------------------------------
      - name: Gradle Check
        shell: bash
        run: |
          # We must pass -PtongsuoHome so Gradle finds the headers and libs
          ./gradlew check -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME > gradle_check.log 2>&1

      - name: Build Test JAR (Linux Only)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :tongsuo-openjdk:testJar -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME

      # -----------------------------------------------------------
      # Artifacts & Logs
      # -----------------------------------------------------------
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-static-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log

      - name: Upload Test JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-static-${{ matrix.os }}
          path: openjdk/build/libs/tongsuo-openjdk-*.jar
          if-no-files-found: ignore

  # ==================================================================================
  # Phase 3: Dynamic Build & Test
  # ==================================================================================
  ci-dynamic:
    name: Dynamic - ${{ matrix.os }}
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        os: 
          - ubuntu-24.04
          - macos-14
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    steps:
      - name: Set Environment Variables
        shell: bash
        run: echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11

      - uses: actions/checkout@v4

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v4
        with:
          name: tongsuo-source
          path: ${{ github.workspace }}/Tongsuo

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Unix Dynamic)
      # -----------------------------------------------------------
      - name: Build Tongsuo Dynamic (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          # Removed no-shared
          ./Configure --prefix=$TONGSUO_HOME --libdir=$TONGSUO_HOME/lib \
            enable-weak-ssl-ciphers enable-ntls \
            --strict-warnings --release > configure.log 2>&1
            
          make -s -j4 > build.log 2>&1
          make install >> build.log 2>&1

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Windows Dynamic)
      # -----------------------------------------------------------
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo Dynamic (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          # Removed no-shared
          perl .\Configure --prefix=$Env:TONGSUO_HOME no-capieng no-makedepend enable-weak-ssl-ciphers enable-ntls --release
          nmake /S
          nmake install

      # -----------------------------------------------------------
      # Gradle Build & Test (Dynamic)
      # -----------------------------------------------------------
      - name: Gradle Check (Dynamic)
        shell: bash
        run: |
          # Set runtime library paths
          if [[ "${{ runner.os }}" == "Linux" ]]; then
             export LD_LIBRARY_PATH=$TONGSUO_HOME/lib:$LD_LIBRARY_PATH
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
             export DYLD_LIBRARY_PATH=$TONGSUO_HOME/lib:$DYLD_LIBRARY_PATH
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
             export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
          fi
          
          ./gradlew check -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome=$TONGSUO_HOME > gradle_check.log 2>&1

      - name: Build Test JAR with Dynamic Lib Dep (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :tongsuo-openjdk:testJar -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome=$TONGSUO_HOME

      # -----------------------------------------------------------
      # Error Handling
      # -----------------------------------------------------------
      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-dynamic-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log