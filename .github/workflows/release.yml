name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to build (e.g., 1.1.0)'
        required: true
        default: '1.1.0'
      publish_release:
        description: 'Publish release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TONGSUO_VERSION: 8.4-stable

jobs:
  # ==================================================================================
  # Phase 1: Prepare Source Code
  # ==================================================================================
  clone_tongsuo:
    name: Prepare Source
    runs-on: ubuntu-latest
    steps:
      - name: Clone Tongsuo Repository
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      - name: Archive Tongsuo Source
        uses: actions/upload-artifact@v6
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo
          retention-days: 1

  # ==================================================================================
  # Phase 2: Build Static Library
  # ==================================================================================
  build-static:
    name: Static - ${{ matrix.platform.target }}
    needs: clone_tongsuo
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04,     target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-14,         target: darwin64-x86_64, use_qemu: true }
          - { os: macos-14,         target: darwin64-arm64 }
          - { os: windows-latest,   target: VC-WIN64A }
          - { os: windows-latest,   target: VC-WIN64-ARM, arch: arm64 }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45

    steps:
      - name: Show System Architecture
        shell: bash
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "System Architecture Information"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Runner OS: ${{ runner.os }}"
          echo "Platform target: ${{ matrix.platform.target }}"
          echo ""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "macOS Architecture (uname -m): $(uname -m)"
            echo "macOS Architecture (arch): $(arch)"
            echo "Available architectures:"
            lipo -info $(which clang) 2>/dev/null || echo "  clang: $(file $(which clang))"
            echo ""
            echo "Java version and architecture:"
            java -version 2>&1
            file $(which java)
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "Linux Architecture (uname -m): $(uname -m)"
            echo "CPU info:"
            lscpu | grep -E "Architecture|Model name" || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "Windows Architecture:"
            systeminfo | findstr /B /C:"System Type" || echo "N/A"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV
          
          # Set architecture-specific flags for macOS
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
              # Cross-compilation for x86_64 on ARM runners with Rosetta 2
              echo "CC=clang -arch x86_64" >> $GITHUB_ENV
              echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
              echo "CFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "CXXFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "LDFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_ldFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cppFlags=-arch x86_64" >> $GITHUB_ENV
              echo "Configuring cross-compilation for x86_64..."
            elif [[ "${{ matrix.platform.target }}" == "darwin64-arm64" ]]; then
              # Native ARM64 build - macos-14 is ARM64 by default, no flags needed
              echo "Building natively for ARM64"
            fi
          fi

      - name: Set up Rosetta 2 for x86_64 emulation (macOS)
        if: runner.os == 'macOS' && matrix.platform.use_qemu == true
        shell: bash
        run: |
          # Rosetta 2 is already installed on macOS ARM runners
          # Verify it's available
          if ! arch -x86_64 uname -m; then
            echo "Installing Rosetta 2..."
            softwareupdate --install-rosetta --agree-to-license
          fi
          echo "Rosetta 2 is available"

      - name: Set up llvm-mingw for Windows ARM64 cross-compilation
        if: matrix.platform.cross_compile == true && matrix.platform.target == 'VC-WIN64-ARM'
        shell: bash
        run: |
          echo "Installing llvm-mingw toolchain for ARM64..."
          
          # Download and install llvm-mingw (supports ARM64)
          LLVM_MINGW_VERSION="20231128"
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          
          wget -q "${LLVM_MINGW_URL}" -O /tmp/llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          rm /tmp/llvm-mingw.tar.xz
          
          # Add to PATH (Configure will use --cross-compile-prefix)
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH
          export PATH="/opt/llvm-mingw/bin:$PATH"
          
          # Verify installation
          aarch64-w64-mingw32-clang --version
          echo "llvm-mingw ARM64 toolchain installed successfully"

      - name: Set up JDK 11 (x86_64 for macOS x64)
        if: runner.os == 'macOS' && matrix.platform.target == 'darwin64-x86_64'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - name: Set up JDK 11 (ARM64 for macOS ARM64)
        if: runner.os == 'macOS' && matrix.platform.target == 'darwin64-arm64'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: aarch64

      - name: Set up JDK 11 (default for other platforms)
        if: "(runner.os != 'macOS') && (matrix.platform.cross_compile != true)"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - uses: actions/checkout@v6

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v7
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo
        continue-on-error: true
        id: download_artifact

      - name: Clone Tongsuo Directly (Fallback for Windows)
        if: steps.download_artifact.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      # --- Build C Lib (Unix) ---
      - name: Build Tongsuo Static (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          # Fix permissions
          chmod +x Configure config
          
          # Determine configuration target
          CONFIG_TARGET="${{ matrix.platform.target }}"
          CONFIG_ARGS=""
          STRICT_WARNINGS="--strict-warnings"
          
          echo "Configuring ${CONFIG_TARGET}..."
          ./Configure ${CONFIG_TARGET} \
            --prefix=$TONGSUO_HOME \
            --libdir=$TONGSUO_HOME/lib \
            enable-weak-ssl-ciphers enable-ntls no-shared \
            ${STRICT_WARNINGS} --release -fstack-protector-strong \
            ${CONFIG_ARGS}
            
          echo "Building..."
          make -s -j4
          
          echo "Installing..."
          make install

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Windows)
      # -----------------------------------------------------------
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
          
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows' && matrix.platform.target == 'VC-WIN64A'
        
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo Static (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          
          # Build configure command based on architecture
          if ("${{ matrix.platform.arch }}" -eq "arm64") {
            Write-Host "Configuring ${{ matrix.platform.target }} for ARM64 cross-compilation..."
            perl .\Configure ${{ matrix.platform.target }} `
              --prefix=$Env:TONGSUO_HOME `
              no-capieng no-makedepend `
              enable-weak-ssl-ciphers enable-ntls no-shared --release `
              no-asm
          } else {
            Write-Host "Configuring ${{ matrix.platform.target }}..."
            perl .\Configure ${{ matrix.platform.target }} `
              --prefix=$Env:TONGSUO_HOME `
              no-capieng no-makedepend `
              enable-weak-ssl-ciphers enable-ntls no-shared --release
          }
          
          Write-Host "Building..."
          nmake /S
          
          Write-Host "Installing..."
          nmake install

      # --- Build Java SDK ---
      - name: Setup Gradle Repository Override
        shell: bash
        run: |
          # Create init.gradle to override repositories with official Maven Central
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITGRADLE'
          allprojects {
            buildscript {
              repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
              }
            }
            repositories {
              google()
              mavenCentral()
            }
          }
          INITGRADLE
          echo "Created Gradle init script to use official repositories"

      - name: Gradle Assemble
        # Skip Windows ARM64 - Gradle Native doesn't support MSVC ARM64 cross-compilation from x64 host
        if: ${{ !(runner.os == 'Windows' && matrix.platform.arch == 'arm64') }}
        shell: bash
        run: |
          GRADLE_ARGS=""
          TASK="assemble"
          GRADLE_CMD="./gradlew"
          
          # For macOS x86_64 on ARM, use Rosetta 2 to run x86_64 JDK
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
            GRADLE_ARGS="-Parch=x86_64 -PldFlags=\"-arch x86_64\" -PcFlags=\"-arch x86_64\" -PcppFlags=\"-arch x86_64\""
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
          fi
          
          # For macOS ARM64, let it build natively (no special flags needed)
          # The JDK and toolchain will be ARM64 by default on macos-14

          # Add Tongsuo to PATH for Windows
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
            # Convert to Unix-style path with forward slashes (Gradle accepts this on Windows)
            if command -v cygpath >/dev/null 2>&1; then
              TONGSUO_HOME_GRADLE=$(cygpath -m "$TONGSUO_HOME")
            else
              # Fallback: just use as-is and normalize to forward slashes
              TONGSUO_HOME_GRADLE=$(echo "$TONGSUO_HOME" | sed 's|\\|/|g')
            fi
            echo "Normalized TONGSUO_HOME for Gradle: $TONGSUO_HOME -> $TONGSUO_HOME_GRADLE"
          else
            TONGSUO_HOME_GRADLE="$TONGSUO_HOME"
          fi
          
          echo "Running Gradle $TASK with args: $GRADLE_ARGS..."
          eval $GRADLE_CMD $TASK -PcheckErrorQueue -PtongsuoHome="$TONGSUO_HOME_GRADLE" $GRADLE_ARGS

      - name: Explain Windows ARM64 Skip (Gradle Assemble)
        if: runner.os == 'Windows' && matrix.platform.arch == 'arm64'
        shell: bash
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  Gradle Assemble Skipped for Windows ARM64"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Reason: Gradle Native plugin doesn't support MSVC ARM64"
          echo "        cross-compilation from x64 host."
          echo ""
          echo "Status: Tongsuo C libraries already built in previous step."
          echo "        Java SDK build will be skipped for this platform."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Gradle Test
        # Skip Windows ARM64 - Gradle Native doesn't support MSVC ARM64 cross-compilation from x64 host
        if: ${{ !(runner.os == 'Windows' && matrix.platform.arch == 'arm64') }}
        shell: bash
        run: |
          GRADLE_ARGS=""
          TASK="test"
          GRADLE_CMD="./gradlew"
          
          # For macOS x86_64 on ARM, use Rosetta 2 to run x86_64 JDK
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
            GRADLE_ARGS="-Parch=x86_64 -PldFlags=\"-arch x86_64\" -PcFlags=\"-arch x86_64\" -PcppFlags=\"-arch x86_64\""
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
            echo "✅ Running tests for macOS x86_64 using Rosetta 2 emulation"
          fi
          
          # For macOS ARM64, let it build natively (no special flags needed)
          # The JDK and toolchain will be ARM64 by default on macos-14

          # Add Tongsuo to PATH for Windows
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
            # Convert to Unix-style path with forward slashes (Gradle accepts this on Windows)
            if command -v cygpath >/dev/null 2>&1; then
              TONGSUO_HOME_GRADLE=$(cygpath -m "$TONGSUO_HOME")
            else
              # Fallback: just use as-is and normalize to forward slashes
              TONGSUO_HOME_GRADLE=$(echo "$TONGSUO_HOME" | sed 's|\\|/|g')
            fi
            echo "Normalized TONGSUO_HOME for Gradle: $TONGSUO_HOME -> $TONGSUO_HOME_GRADLE"
          else
            TONGSUO_HOME_GRADLE="$TONGSUO_HOME"
          fi
          
          echo "Running Gradle $TASK with args: $GRADLE_ARGS..."
          eval $GRADLE_CMD $TASK -PcheckErrorQueue -PtongsuoHome="$TONGSUO_HOME_GRADLE" $GRADLE_ARGS

      - name: Explain Windows ARM64 Skip (Gradle Test)
        if: runner.os == 'Windows' && matrix.platform.arch == 'arm64'
        shell: bash
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  Gradle Test Skipped for Windows ARM64"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Reason: Gradle Native plugin doesn't support MSVC ARM64"
          echo "        cross-compilation from x64 host."
          echo ""
          echo "Status: Tests cannot run on x64 runner for ARM64 binaries."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Verify Windows ARM64 Build
        if: runner.os == 'Windows' && matrix.platform.arch == 'arm64'
        shell: bash
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  Windows ARM64 Build Status"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Verify Tongsuo libraries exist (Windows uses .lib extension)
          libPath="$TONGSUO_HOME/lib"
          libCrypto="$libPath/libcrypto.lib"
          libSsl="$libPath/libssl.lib"
          
          if [[ -f "$libCrypto" && -f "$libSsl" ]]; then
            echo "✅ Tongsuo C libraries built successfully:"
            ls -lh "$libCrypto"
            ls -lh "$libSsl"
            echo ""
            echo "❌ Java SDK (JNI) NOT built - Gradle Native doesn't support MSVC ARM64 cross-compilation"
          else
            echo "❌ Tongsuo libraries not found at:"
            echo "   $libCrypto"
            echo "   $libSsl"
            echo ""
            echo "Contents of $TONGSUO_HOME:"
            ls -laR "$TONGSUO_HOME" || true
            exit 1
          fi
          
          # Check Java SDK build status
          echo ""
          echo "Java SDK Build Status:"
          if [[ -d "openjdk/build/libs" ]] && ls openjdk/build/libs/*.jar >/dev/null 2>&1; then
            echo "✅ Java SDK JAR built successfully"
            ls -lh openjdk/build/libs/*.jar
          else
            echo "ℹ️  Java SDK not built (expected for ARM64)"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Rename Static JAR
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          cd openjdk/build/libs/
          SRC_JAR=$(ls tongsuo-openjdk-*.jar 2>/dev/null | grep -v "sources" | grep -v "javadoc" | head -n 1 || echo "")
          
          if [ -z "$SRC_JAR" ]; then
             echo "Error: Generated JAR not found!"
             ls -la
             exit 1
          fi
          
          NEW_NAME="tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar"
          
          if [ "$SRC_JAR" != "$NEW_NAME" ]; then
            echo "Renaming $SRC_JAR -> $NEW_NAME"
            mv "$SRC_JAR" "$NEW_NAME"
          else
            echo "JAR already has correct name: $NEW_NAME"
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-static-${{ matrix.platform.target }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log
          if-no-files-found: ignore

      - name: Upload Artifact
        # Skip Windows ARM64 (no JAR built)
        if: ${{ !(runner.os == 'Windows' && matrix.platform.arch == 'arm64') }}
        uses: actions/upload-artifact@v6
        with:
          name: jar-static-${{ matrix.platform.target }}
          path: openjdk/build/libs/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar
          retention-days: 1

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: success() && matrix.platform.target != 'VC-WIN64-ARM'
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
          files: openjdk/build/libs/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar
          fail_on_unmatched_files: true

  # ==================================================================================
  # Phase 3: Build Dynamic Library
  # ==================================================================================
  build-dynamic:
    name: Dynamic - ${{ matrix.platform.target }}
    needs: clone_tongsuo
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04,     target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-14,         target: darwin64-x86_64, use_qemu: true }
          - { os: macos-14,         target: darwin64-arm64 }
          - { os: windows-latest,   target: VC-WIN64A }
          - { os: windows-latest,   target: VC-WIN64-ARM, arch: arm64 }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45

    steps:
      - name: Show System Architecture
        shell: bash
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "System Architecture Information"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Runner OS: ${{ runner.os }}"
          echo "Platform target: ${{ matrix.platform.target }}"
          echo ""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "macOS Architecture (uname -m): $(uname -m)"
            echo "macOS Architecture (arch): $(arch)"
            echo "Available architectures:"
            lipo -info $(which clang) 2>/dev/null || echo "  clang: $(file $(which clang))"
            echo ""
            echo "Java version and architecture:"
            java -version 2>&1
            file $(which java)
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "Linux Architecture (uname -m): $(uname -m)"
            echo "CPU info:"
            lscpu | grep -E "Architecture|Model name" || true
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "Windows Architecture:"
            systeminfo | findstr /B /C:"System Type" || echo "N/A"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV
          
          # Set architecture-specific flags for macOS
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
              # Cross-compilation for x86_64 on ARM runners with Rosetta 2
              echo "CC=clang -arch x86_64" >> $GITHUB_ENV
              echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
              echo "CFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "CXXFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "LDFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_ldFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cppFlags=-arch x86_64" >> $GITHUB_ENV
            elif [[ "${{ matrix.platform.target }}" == "darwin64-arm64" ]]; then
              # Native ARM64 build - macos-14 is ARM64 by default, no flags needed
              echo "Building natively for ARM64"
            fi
          fi
          echo "Rosetta 2 is available"

      - name: Set up Rosetta 2 for x86_64 emulation (macOS)
        if: runner.os == 'macOS' && matrix.platform.use_qemu == true
        shell: bash
        run: |
          # Rosetta 2 is already installed on macOS ARM runners
          # Verify it's available
          if ! arch -x86_64 uname -m; then
            echo "Installing Rosetta 2..."
            softwareupdate --install-rosetta --agree-to-license
          fi
          echo "Rosetta 2 is available"

      - name: Set up JDK 11 (x86_64 for macOS x64)
        if: runner.os == 'macOS' && matrix.platform.target == 'darwin64-x86_64'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - name: Set up JDK 11 (ARM64 for macOS ARM64)
        if: runner.os == 'macOS' && matrix.platform.target == 'darwin64-arm64'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: aarch64

      - name: Set up JDK 11 (default)
        if: "(runner.os != 'macOS')"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - uses: actions/checkout@v6

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v7
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo
        continue-on-error: true
        id: download_artifact

      - name: Clone Tongsuo Directly (Fallback for Windows)
        if: steps.download_artifact.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Unix Dynamic)
      # -----------------------------------------------------------
      - name: Build Tongsuo Dynamic (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          # Fix permissions
          chmod +x Configure config
          
          # Determine configuration target
          CONFIG_TARGET="${{ matrix.platform.target }}"
          CONFIG_ARGS=""
          STRICT_WARNINGS="--strict-warnings"
          
          echo "Configuring ${CONFIG_TARGET} (dynamic)..."
          ./Configure ${CONFIG_TARGET} \
            --prefix=$TONGSUO_HOME \
            --libdir=$TONGSUO_HOME/lib \
            enable-weak-ssl-ciphers enable-ntls \
            ${STRICT_WARNINGS} --release \
            ${CONFIG_ARGS}
            
          echo "Building..."
          make -s -j4
          
          echo "Installing..."
          make install

      # -----------------------------------------------------------
      # Build Tongsuo C Lib (Windows Dynamic)
      # -----------------------------------------------------------
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.arch == 'arm64' && 'amd64_arm64' || 'amd64' }}
          
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows' && matrix.platform.target == 'VC-WIN64A'
        
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo Dynamic (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          
          # Build configure command based on architecture
          if ("${{ matrix.platform.arch }}" -eq "arm64") {
            Write-Host "Configuring ${{ matrix.platform.target }} (ARM64 cross-compilation)..."
            perl .\Configure ${{ matrix.platform.target }} `
              --prefix=$Env:TONGSUO_HOME `
              no-capieng no-makedepend `
              enable-weak-ssl-ciphers enable-ntls --release `
              no-asm
          } else {
            Write-Host "Configuring ${{ matrix.platform.target }} (dynamic)..."
            perl .\Configure ${{ matrix.platform.target }} `
              --prefix=$Env:TONGSUO_HOME `
              no-capieng no-makedepend `
              enable-weak-ssl-ciphers enable-ntls --release
          }
          
          Write-Host "Building..."
          nmake /S
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Build failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          Write-Host "Installing..."
          nmake install
          
          if ($LASTEXITCODE -ne 0) {
            Write-Host "❌ Install failed with exit code $LASTEXITCODE"
            exit 1
          }
          
          # Verify library files exist
          Write-Host "`n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          Write-Host "Verifying Tongsuo installation..."
          Write-Host "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if (Test-Path "$Env:TONGSUO_HOME\lib") {
            Write-Host "✅ lib directory exists"
            Get-ChildItem "$Env:TONGSUO_HOME\lib" | Format-Table Name, Length
          } else {
            Write-Host "❌ lib directory NOT found"
            exit 1
          }
          if (Test-Path "$Env:TONGSUO_HOME\include\openssl") {
            Write-Host "✅ include directory exists"
          } else {
            Write-Host "❌ include directory NOT found"
            exit 1
          }
          
          # Check for required library files
          if (-not (Test-Path "$Env:TONGSUO_HOME\lib\libssl.lib")) {
            Write-Host "❌ libssl.lib NOT found"
            exit 1
          }
          if (-not (Test-Path "$Env:TONGSUO_HOME\lib\libcrypto.lib")) {
            Write-Host "❌ libcrypto.lib NOT found"
            exit 1
          }
          Write-Host "✅ Required library files found"

      # --- Set up runtime library paths ---
      - name: Set PATH for Dynamic Libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$TONGSUO_HOME/bin" >> $GITHUB_PATH
          echo "$TONGSUO_HOME/lib" >> $GITHUB_PATH

      # --- Build Java SDK ---
      - name: Setup Gradle Repository Override
        shell: bash
        run: |
          # Create init.gradle to override repositories with official Maven Central
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITGRADLE'
          allprojects {
            buildscript {
              repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
              }
            }
            repositories {
              google()
              mavenCentral()
            }
          }
          INITGRADLE
          echo "Created Gradle init script to use official repositories"

      - name: Gradle Assemble
        # Skip Windows ARM64 - Gradle Native doesn't support MSVC ARM64 cross-compilation from x64 host
        if: ${{ !(runner.os == 'Windows' && matrix.platform.arch == 'arm64') }}
        shell: bash
        run: |
          GRADLE_ARGS=""
          TASK="assemble"
          GRADLE_CMD="./gradlew"
          
          # MacOS x86_64: Use Rosetta 2 to run x86_64 JDK and tests
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
            GRADLE_ARGS="-Parch=x86_64 -PldFlags=\"-arch x86_64\" -PcFlags=\"-arch x86_64\" -PcppFlags=\"-arch x86_64\""
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
            TASK="assemble"
            echo "✅ Running tests for macOS x86_64 using Rosetta 2 emulation"
          fi
          
          # For macOS ARM64, let it build natively (no special flags needed)
          # The JDK and toolchain will be ARM64 by default on macos-14
          
          # Set runtime library paths for dynamic linking
          if [[ "${{ runner.os }}" == "Linux" ]]; then
             export LD_LIBRARY_PATH=$TONGSUO_HOME/lib:$LD_LIBRARY_PATH
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
             export DYLD_LIBRARY_PATH=$TONGSUO_HOME/lib:$DYLD_LIBRARY_PATH
          fi
          
          # Windows Path
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
            # Convert to Unix-style path with forward slashes (Gradle accepts this on Windows)
            if command -v cygpath >/dev/null 2>&1; then
              TONGSUO_HOME_GRADLE=$(cygpath -m "$TONGSUO_HOME")
            else
              # Fallback: just use as-is and normalize to forward slashes
              TONGSUO_HOME_GRADLE=$(echo "$TONGSUO_HOME" | sed 's|\\|/|g')
            fi
            echo "Normalized TONGSUO_HOME for Gradle: $TONGSUO_HOME -> $TONGSUO_HOME_GRADLE"
          else
            TONGSUO_HOME_GRADLE="$TONGSUO_HOME"
          fi
          
          echo "Running Gradle $TASK with args: $GRADLE_ARGS..."
          eval $GRADLE_CMD $TASK -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome="$TONGSUO_HOME_GRADLE" $GRADLE_ARGS

      - name: Explain Windows ARM64 Skip (Gradle Assemble - Dynamic)
        if: runner.os == 'Windows' && matrix.platform.arch == 'arm64'
        shell: bash
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  Gradle Assemble Skipped for Windows ARM64"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Reason: Gradle Native plugin doesn't support MSVC ARM64"
          echo "        cross-compilation from x64 host."
          echo ""
          echo "Status: Tongsuo C libraries already built in previous step."
          echo "        Java SDK build will be skipped for this platform."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Fix Dynamic Library Paths (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Fixing macOS Dynamic Library Paths"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Find the JNI library
          JNI_LIB=$(find openjdk/build/libs -name "libconscrypt_openjdk_jni.dylib" | head -1)
          
          if [ -n "$JNI_LIB" ]; then
            echo "Found JNI library: $JNI_LIB"
            echo ""
            echo "Current dependencies:"
            otool -L "$JNI_LIB"
            echo ""
            
            # Change absolute paths to @rpath
            install_name_tool -change "$TONGSUO_HOME/lib/libssl.3.dylib" "@rpath/libssl.3.dylib" "$JNI_LIB" || true
            install_name_tool -change "$TONGSUO_HOME/lib/libcrypto.3.dylib" "@rpath/libcrypto.3.dylib" "$JNI_LIB" || true
            
            # Add @loader_path as rpath (search relative to the library itself)
            install_name_tool -add_rpath "@loader_path" "$JNI_LIB" || true
            install_name_tool -add_rpath "@loader_path/." "$JNI_LIB" || true
            
            # Add system library paths
            install_name_tool -add_rpath "/usr/local/lib" "$JNI_LIB" || true
            install_name_tool -add_rpath "/opt/homebrew/lib" "$JNI_LIB" || true
            
            echo "Fixed dependencies:"
            otool -L "$JNI_LIB"
            echo "✅ Dynamic library paths fixed"
          else
            echo "⚠️  No JNI library found (might be skipped for this platform)"
          fi

      - name: Fix Dynamic Library Paths (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Fixing Linux Dynamic Library Paths"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Find the JNI library
          JNI_LIB=$(find openjdk/build/libs -name "libconscrypt_openjdk_jni.so" | head -1)
          
          if [ -n "$JNI_LIB" ]; then
            echo "Found JNI library: $JNI_LIB"
            echo ""
            echo "Current dependencies:"
            ldd "$JNI_LIB" || true
            echo ""
            
            # Set rpath to search in common locations
            patchelf --set-rpath '$ORIGIN:/usr/local/lib:/usr/lib:/lib' "$JNI_LIB" || true
            
            echo "Fixed dependencies:"
            ldd "$JNI_LIB" || true
            echo "✅ Dynamic library paths fixed"
          else
            echo "⚠️  No JNI library found (might be skipped for this platform)"
          fi

      - name: Gradle Test
        # Skip Windows ARM64 - Gradle Native doesn't support MSVC ARM64 cross-compilation from x64 host
        if: ${{ !(runner.os == 'Windows' && matrix.platform.arch == 'arm64') }}
        shell: bash
        run: |
          GRADLE_ARGS=""
          TASK="test"
          GRADLE_CMD="./gradlew"
          
          # MacOS x86_64: Use Rosetta 2 to run x86_64 JDK and tests
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
            GRADLE_ARGS="-Parch=x86_64 -PldFlags=\"-arch x86_64\" -PcFlags=\"-arch x86_64\" -PcppFlags=\"-arch x86_64\""
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
            TASK="test"
            echo "✅ Running tests for macOS x86_64 using Rosetta 2 emulation"
          fi
          
          # For macOS ARM64, let it build natively (no special flags needed)
          # The JDK and toolchain will be ARM64 by default on macos-14
          
          # Set runtime library paths for dynamic linking
          if [[ "${{ runner.os }}" == "Linux" ]]; then
             export LD_LIBRARY_PATH=$TONGSUO_HOME/lib:$LD_LIBRARY_PATH
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
             export DYLD_LIBRARY_PATH=$TONGSUO_HOME/lib:$DYLD_LIBRARY_PATH
          fi
          
          # Windows Path
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
            # Convert to Unix-style path with forward slashes (Gradle accepts this on Windows)
            if command -v cygpath >/dev/null 2>&1; then
              TONGSUO_HOME_GRADLE=$(cygpath -m "$TONGSUO_HOME")
            else
              # Fallback: just use as-is and normalize to forward slashes
              TONGSUO_HOME_GRADLE=$(echo "$TONGSUO_HOME" | sed 's|\\|/|g')
            fi
            echo "Normalized TONGSUO_HOME for Gradle: $TONGSUO_HOME -> $TONGSUO_HOME_GRADLE"
          else
            TONGSUO_HOME_GRADLE="$TONGSUO_HOME"
          fi
          
          echo "Running Gradle $TASK with args: $GRADLE_ARGS..."
          eval $GRADLE_CMD $TASK -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome="$TONGSUO_HOME_GRADLE" $GRADLE_ARGS

      - name: Explain Windows ARM64 Skip (Gradle Test - Dynamic)
        if: runner.os == 'Windows' && matrix.platform.arch == 'arm64'
        shell: bash
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  Gradle Test Skipped for Windows ARM64"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Reason: Gradle Native plugin doesn't support MSVC ARM64"
          echo "        cross-compilation from x64 host."
          echo ""
          echo "Status: Tests cannot run on x64 runner for ARM64 binaries."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Verify Windows ARM64 Build (Dynamic)
        if: runner.os == 'Windows' && matrix.platform.arch == 'arm64'
        shell: bash
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⚠️  Windows ARM64 Build Status (Dynamic)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "✅ Tongsuo C libraries built successfully (verified in PowerShell step)"
          echo "❌ Java SDK (JNI) NOT built - Gradle Native doesn't support MSVC ARM64 cross-compilation"
          echo ""
          echo "Library files:"
          echo "  - libcrypto.lib"
          echo "  - libssl.lib"
          echo ""
          echo "Reason for skipping JNI:"
          echo "  Gradle Native plugin detects host architecture (x64) instead of target (ARM64)"
          echo "  This causes x64 JNI code to be compiled, which cannot link with ARM64 libraries"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Rename Dynamic JAR
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          cd openjdk/build/libs/
          SRC_JAR=$(ls tongsuo-openjdk-*.jar 2>/dev/null | grep -v "sources" | grep -v "javadoc" | head -n 1 || echo "")
          
          if [ -z "$SRC_JAR" ]; then
             echo "Error: Generated JAR not found!"
             ls -la
             exit 1
          fi
          
          # tongsuo-openjdk-dynamic-[version]-[target].jar
          NEW_NAME="tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar"
          
          if [ "$SRC_JAR" != "$NEW_NAME" ]; then
            echo "Renaming $SRC_JAR -> $NEW_NAME"
            mv "$SRC_JAR" "$NEW_NAME"
          else
            echo "JAR already has correct name: $NEW_NAME"
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-dynamic-${{ matrix.platform.target }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log
          if-no-files-found: ignore

      - name: Upload Artifact
        # Skip Windows ARM64 (no JAR built)
        if: ${{ !(runner.os == 'Windows' && matrix.platform.arch == 'arm64') }}
        uses: actions/upload-artifact@v6
        with:
          name: jar-dynamic-${{ matrix.platform.target }}
          path: openjdk/build/libs/tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar
          retention-days: 1

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: success() && matrix.platform.target != 'VC-WIN64-ARM'
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
          files: openjdk/build/libs/tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar
          fail_on_unmatched_files: true
  # ==================================================================================
  # Phase 4: Build Uber JARs (Static & Dynamic)
  # ==================================================================================
  
  # Static Uber JAR - Recommended for most users (no external dependencies)
  build-static-uber-jar:
    name: Build Static Uber JAR
    needs: build-static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11

      - name: Create Uber JAR Directory
        run: |
          mkdir -p uber-jar-work
          cd uber-jar-work
          mkdir -p jars
          mkdir -p base

      - name: Download Linux x64 Static JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-static-linux-x86_64
          path: uber-jar-work/jars/

      - name: Download Linux ARM64 Static JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-static-linux-aarch64
          path: uber-jar-work/jars/

      - name: Download macOS x64 Static JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-static-darwin64-x86_64
          path: uber-jar-work/jars/

      - name: Download macOS ARM64 Static JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-static-darwin64-arm64
          path: uber-jar-work/jars/

      - name: Download Windows x64 Static JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-static-VC-WIN64A
          path: uber-jar-work/jars/

      # Windows ARM64 JAR not available - Gradle Native doesn't support MSVC ARM64 cross-compilation
      # - name: Download Windows ARM64 Static JAR
      #   uses: actions/download-artifact@v7
      #   with:
      #     name: jar-static-VC-WIN64-ARM
      #     path: uber-jar-work/jars/

      - name: Extract and Merge Native Libraries
        run: |
          cd uber-jar-work
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Building Static Uber JAR - All Platforms"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Extract first JAR to get the base structure
          FIRST_JAR=$(ls jars/*.jar | head -1)
          echo "Using $FIRST_JAR as base..."
          unzip -q "$FIRST_JAR" -d base/
          
          # Extract native libraries from all JARs
          for jar in jars/*.jar; do
            echo "Extracting native libraries from $(basename $jar)..."
            echo "  Checking contents..."
            jar tf "$jar" | grep "META-INF/native" || echo "  No META-INF/native found"
            unzip -q "$jar" "META-INF/native/*" -d temp/ 2>/dev/null || true
            if [ -d temp/META-INF/native ]; then
              echo "  Found native libs, copying to base..."
              mkdir -p base/META-INF/native
              cp -v temp/META-INF/native/* base/META-INF/native/ 2>/dev/null || true
              rm -rf temp
            else
              echo "  No native directory found after extraction"
            fi
          done
          
          # List all included native libraries
          echo ""
          echo "Included native libraries:"
          find base/META-INF/native -type f 2>/dev/null | sort || echo "  (none found)"
          
          # Create uber JAR
          echo ""
          echo "Creating static uber JAR..."
          cd base
          jar cf ../tongsuo-openjdk-${{ inputs.version }}-uber.jar .
          cd ..
          
          # Show JAR info
          echo ""
          echo "Static Uber JAR created:"
          ls -lh tongsuo-openjdk-${{ inputs.version }}-uber.jar
          echo ""
          echo "Native library contents:"
          jar tf tongsuo-openjdk-${{ inputs.version }}-uber.jar | grep "META-INF/native" | sort

      - name: Verify Static Uber JAR
        run: |
          cd uber-jar-work
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Static Uber JAR Verification"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Count platforms by checking for native library files
          LINUX_COUNT=$(jar tf tongsuo-openjdk-${{ inputs.version }}-uber.jar | grep "META-INF/native.*linux" | wc -l | tr -d ' ')
          DARWIN_COUNT=$(jar tf tongsuo-openjdk-${{ inputs.version }}-uber.jar | grep "META-INF/native.*\(darwin\|osx\)" | wc -l | tr -d ' ')
          WINDOWS_COUNT=$(jar tf tongsuo-openjdk-${{ inputs.version }}-uber.jar | grep "META-INF/native.*\(windows\|win\)" | wc -l | tr -d ' ')
          
          echo "Platform Coverage:"
          echo "  Linux libraries:   $LINUX_COUNT"
          echo "  macOS libraries:   $DARWIN_COUNT"
          echo "  Windows libraries: $WINDOWS_COUNT"
          echo ""
          
          # Expected: 5 platforms (Linux x64/ARM64, macOS x64/ARM64, Windows x64)
          # Windows ARM64 is skipped due to Gradle Native limitations
          EXPECTED_MIN=5
          TOTAL=$((LINUX_COUNT + DARWIN_COUNT + WINDOWS_COUNT))
          
          echo "Total native libraries: $TOTAL"
          echo "Expected minimum: $EXPECTED_MIN"
          echo ""
          
          if [ $TOTAL -ge $EXPECTED_MIN ]; then
            echo "✅ Verification passed!"
          else
            echo "⚠️  Warning: Found fewer libraries than expected"
            echo "This might be OK if some platforms were skipped"
            exit 0  # Don't fail the build
          fi

      - name: Upload Static Uber JAR Artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-static-uber
          path: uber-jar-work/tongsuo-openjdk-${{ inputs.version }}-uber.jar
          retention-days: 7

      - name: Upload Static Uber JAR to Release
        uses: softprops/action-gh-release@v2
        if: ${{ inputs.publish_release == true }}
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
          files: uber-jar-work/tongsuo-openjdk-${{ inputs.version }}-uber.jar
          fail_on_unmatched_files: true
          body: |
            ## 📦 Static Uber JAR (Recommended)
            
            **Static linking - No external dependencies required!**
            
            This JAR contains native libraries for all platforms with Tongsuo statically linked:
            - ✅ Linux x64
            - ✅ Linux ARM64
            - ✅ macOS x64
            - ✅ macOS ARM64
            - ✅ Windows x64
            - ❌ Windows ARM64 (not supported due to Gradle Native limitations)
            
            **Benefits:**
            - ✅ No need to install Tongsuo separately
            - ✅ Works out of the box
            - ✅ Larger file size but simpler deployment
            
            **Usage:**
            ```bash
            java -cp tongsuo-openjdk-${{ inputs.version }}-uber.jar:your-app.jar com.example.YourApp
            ```

