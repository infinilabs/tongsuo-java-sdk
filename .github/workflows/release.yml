name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to build (e.g., 1.1.0)'
        required: true
        default: '1.1.0'

permissions:
  contents: write

env:
  TONGSUO_VERSION: 8.4-stable

jobs:
  # ==================================================================================
  # Phase 1: Prepare Source Code
  # ==================================================================================
  clone_tongsuo:
    name: Prepare Source
    runs-on: ubuntu-latest
    steps:
      - name: Clone Tongsuo Repository
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      - name: Archive Tongsuo Source
        uses: actions/upload-artifact@v6
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo
          retention-days: 1

  # ==================================================================================
  # Phase 2: Build Static Library
  # ==================================================================================
  build-static:
    name: Static - ${{ matrix.platform.target }}
    needs: clone_tongsuo
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04,     target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-14,         target: darwin64-x86_64, use_qemu: true }
          - { os: macos-14,         target: darwin64-arm64 }
          - { os: windows-latest,   target: VC-WIN64A }
          - { os: ubuntu-24.04,     target: VC-WIN64-ARM, cross_compile: true }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45

    steps:
      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV
          
          # Set architecture-specific flags for macOS
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
              # Cross-compilation for x86_64 on ARM runners with Rosetta 2
              echo "CC=clang -arch x86_64" >> $GITHUB_ENV
              echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
              echo "CFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "CXXFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "LDFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_ldFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cppFlags=-arch x86_64" >> $GITHUB_ENV
              echo "Configuring cross-compilation for x86_64..."
            elif [[ "${{ matrix.platform.target }}" == "darwin64-arm64" ]]; then
              # Native ARM64 build - explicitly set arm64 architecture
              echo "CC=clang -arch arm64" >> $GITHUB_ENV
              echo "CXX=clang++ -arch arm64" >> $GITHUB_ENV
              echo "CFLAGS=-arch arm64" >> $GITHUB_ENV
              echo "CXXFLAGS=-arch arm64" >> $GITHUB_ENV
              echo "LDFLAGS=-arch arm64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_ldFlags=-arch arm64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cFlags=-arch arm64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cppFlags=-arch arm64" >> $GITHUB_ENV
              echo "Configuring native ARM64 build..."
            fi
          fi

      - name: Set up Rosetta 2 for x86_64 emulation (macOS)
        if: runner.os == 'macOS' && matrix.platform.use_qemu == true
        shell: bash
        run: |
          # Rosetta 2 is already installed on macOS ARM runners
          # Verify it's available
          if ! arch -x86_64 uname -m; then
            echo "Installing Rosetta 2..."
            softwareupdate --install-rosetta --agree-to-license
          fi
          echo "Rosetta 2 is available"

      - name: Set up llvm-mingw for Windows ARM64 cross-compilation
        if: matrix.platform.cross_compile == true && matrix.platform.target == 'VC-WIN64-ARM'
        shell: bash
        run: |
          echo "Installing llvm-mingw toolchain for ARM64..."
          
          # Download and install llvm-mingw (supports ARM64)
          LLVM_MINGW_VERSION="20231128"
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-x86_64.tar.xz"
          
          wget -q "${LLVM_MINGW_URL}" -O /tmp/llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          rm /tmp/llvm-mingw.tar.xz
          
          # Add to PATH (Configure will use --cross-compile-prefix)
          echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH
          export PATH="/opt/llvm-mingw/bin:$PATH"
          
          # Verify installation
          aarch64-w64-mingw32-clang --version
          echo "llvm-mingw ARM64 toolchain installed successfully"

      - name: Set up JDK 11 (x86_64 for macOS x64)
        if: runner.os == 'macOS' && matrix.platform.target == 'darwin64-x86_64'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - name: Set up JDK 11 (default for other platforms)
        if: "(runner.os != 'macOS' || matrix.platform.target != 'darwin64-x86_64') && (matrix.platform.cross_compile != true)"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - uses: actions/checkout@v6

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v7
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo
        continue-on-error: true
        id: download_artifact

      - name: Clone Tongsuo Directly (Fallback for Windows)
        if: steps.download_artifact.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      # --- Build C Lib (Unix) ---
      - name: Build Tongsuo C Lib (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          # Fix permissions
          chmod +x Configure config
          
          # Determine configuration target
          CONFIG_TARGET="${{ matrix.platform.target }}"
          CONFIG_ARGS=""
          
          # For Windows ARM64 cross-compilation on Linux, use mingw64
          if [[ "${{ matrix.platform.cross_compile }}" == "true" && "${{ matrix.platform.target }}" == "VC-WIN64-ARM" ]]; then
            CONFIG_TARGET="mingw64"
            CONFIG_ARGS="--cross-compile-prefix=aarch64-w64-mingw32- no-asm"
            export CFLAGS="$CFLAGS -D_WIN32_WINNT=0x0A00"
            # Set resource compiler for ARM64
            export RC="aarch64-w64-mingw32-windres"
            export WINDRES="aarch64-w64-mingw32-windres"
            # Clear CC to prevent double-prefix (Configure will add prefix automatically)
            unset CC CXX AR RANLIB
            # Remove --strict-warnings to avoid -Werror issues with clang
            STRICT_WARNINGS=""
            echo "Using mingw64 configuration for Windows ARM64 cross-compilation"
          else
            STRICT_WARNINGS="--strict-warnings"
          fi
          
          echo "Configuring ${CONFIG_TARGET}..."
          ./Configure ${CONFIG_TARGET} \
            --prefix=$TONGSUO_HOME \
            --libdir=$TONGSUO_HOME/lib \
            ${STRICT_WARNINGS} --release -fstack-protector-strong \
            enable-weak-ssl-ciphers enable-ntls no-shared \
            ${CONFIG_ARGS}
          
          echo "Building..."
          make -s -j4
          
          echo "Installing..."
          make install

      # --- Build C Lib (Windows) ---
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.target == 'VC-WIN64-ARM' && 'amd64_arm64' || 'amd64' }}
          
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows' && matrix.platform.target == 'VC-WIN64A'
        
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo C Lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          
          Write-Host "Configuring ${{ matrix.platform.target }}..."
          perl .\Configure ${{ matrix.platform.target }} `
            --prefix=$Env:TONGSUO_HOME `
            --release no-capieng no-makedepend `
            enable-weak-ssl-ciphers enable-ntls no-shared
          
          Write-Host "Building..."
          nmake /S
          
          Write-Host "Installing..."
          nmake install

      # --- Build Java SDK ---
      - name: Setup Gradle Repository Override
        shell: bash
        run: |
          # Create init.gradle to override repositories with official Maven Central
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITGRADLE'
          allprojects {
            buildscript {
              repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
              }
            }
            repositories {
              google()
              mavenCentral()
            }
          }
          INITGRADLE
          echo "Created Gradle init script to use official repositories"

      - name: Gradle Assemble
        # Skip Java SDK build for Windows ARM64
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          GRADLE_ARGS=""
          GRADLE_CMD="./gradlew"
          
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then 
            GRADLE_ARGS="-Parch=x86_64"
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
          fi
          
          echo "Building JAR..."
          $GRADLE_CMD assemble -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS

      - name: Gradle Test
        # Skip Java SDK build for Windows ARM64
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          GRADLE_ARGS=""
          GRADLE_CMD="./gradlew"
          
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then 
            GRADLE_ARGS="-Parch=x86_64"
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
            echo "✅ Running tests for macOS x86_64 using Rosetta 2 emulation"
          fi
          if [[ "${{ matrix.platform.target }}" == "VC-WIN64-ARM" ]]; then
            GRADLE_ARGS="-Parch=arm64"
          fi
          
          # Add Tongsuo bin/lib to PATH for Windows tests
          if [[ "${{ runner.os }}" == "Windows" ]]; then
             export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
          fi
          
          $GRADLE_CMD test -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS

          echo "⚠️  Windows ARM64 - C Library Only"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Tongsuo C library built successfully for ARM64"
          echo "❌ Java SDK not built - cross-compilation not supported"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Rename Static JAR
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          cd openjdk/build/libs/
          SRC_JAR=$(ls tongsuo-openjdk-*.jar 2>/dev/null | grep -v "sources" | grep -v "javadoc" | head -n 1 || echo "")
          
          if [ -z "$SRC_JAR" ]; then
             echo "Error: Generated JAR not found!"
             ls -la
             exit 1
          fi
          
          NEW_NAME="tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar"
          
          if [ "$SRC_JAR" != "$NEW_NAME" ]; then
            echo "Renaming $SRC_JAR -> $NEW_NAME"
            mv "$SRC_JAR" "$NEW_NAME"
          else
            echo "JAR already has correct name: $NEW_NAME"
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-static-${{ matrix.platform.target }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log
          if-no-files-found: ignore

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-static-${{ matrix.platform.target }}
          path: openjdk/build/libs/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar
          retention-days: 1

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: success() && matrix.platform.target != 'VC-WIN64-ARM'
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
          files: openjdk/build/libs/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar
          fail_on_unmatched_files: true

  # ==================================================================================
  # Phase 3: Build Dynamic Library
  # ==================================================================================
  build-dynamic:
    name: Dynamic - ${{ matrix.platform.target }}
    needs: clone_tongsuo
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04,     target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-14,         target: darwin64-x86_64, use_qemu: true }
          - { os: macos-14,         target: darwin64-arm64 }
          - { os: windows-latest,   target: VC-WIN64A }
          - { os: ubuntu-24.04,     target: VC-WIN64-ARM, cross_compile: true }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45

    steps:
      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV
          
          # Set architecture-specific flags for macOS
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
              # Cross-compilation for x86_64 on ARM runners with Rosetta 2
              echo "CC=clang -arch x86_64" >> $GITHUB_ENV
              echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
              echo "CFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "CXXFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "LDFLAGS=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_ldFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cFlags=-arch x86_64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cppFlags=-arch x86_64" >> $GITHUB_ENV
            elif [[ "${{ matrix.platform.target }}" == "darwin64-arm64" ]]; then
              # Native ARM64 build - explicitly set arm64 architecture
              echo "CC=clang -arch arm64" >> $GITHUB_ENV
              echo "CXX=clang++ -arch arm64" >> $GITHUB_ENV
              echo "CFLAGS=-arch arm64" >> $GITHUB_ENV
              echo "CXXFLAGS=-arch arm64" >> $GITHUB_ENV
              echo "LDFLAGS=-arch arm64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_ldFlags=-arch arm64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cFlags=-arch arm64" >> $GITHUB_ENV
              echo "ORG_GRADLE_PROJECT_cppFlags=-arch arm64" >> $GITHUB_ENV
            fi
          fi

      - name: Set up Rosetta 2 for x86_64 emulation (macOS)
        if: runner.os == 'macOS' && matrix.platform.use_qemu == true
        shell: bash
        run: |
          # Rosetta 2 is already installed on macOS ARM runners
          # Verify it's available
          if ! arch -x86_64 uname -m; then
            echo "Installing Rosetta 2..."
            softwareupdate --install-rosetta --agree-to-license
          fi
          echo "Rosetta 2 is available"

      - name: Set up JDK 11 (x86_64 for macOS x64)
        if: runner.os == 'macOS' && matrix.platform.target == 'darwin64-x86_64'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - name: Set up JDK 11 (default)
        if: "!(runner.os == 'macOS' && matrix.platform.target == 'darwin64-x86_64')"
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11
          architecture: x64

      - uses: actions/checkout@v6

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v7
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo
        continue-on-error: true
        id: download_artifact

      - name: Clone Tongsuo Directly (Fallback for Windows)
        if: steps.download_artifact.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      # --- Build C Lib (Dynamic) ---
      - name: Build Tongsuo C Lib (Unix Dynamic)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          # Fix permissions
          chmod +x Configure config
          
          # Determine configuration target
          CONFIG_TARGET="${{ matrix.platform.target }}"
          CONFIG_ARGS=""
          
          # For Windows ARM64 cross-compilation on Linux, use mingw64
          if [[ "${{ matrix.platform.cross_compile }}" == "true" && "${{ matrix.platform.target }}" == "VC-WIN64-ARM" ]]; then
            CONFIG_TARGET="mingw64"
            CONFIG_ARGS="--cross-compile-prefix=aarch64-w64-mingw32- no-asm"
            export CFLAGS="$CFLAGS -D_WIN32_WINNT=0x0A00"
            # Set resource compiler for ARM64
            export RC="aarch64-w64-mingw32-windres"
            export WINDRES="aarch64-w64-mingw32-windres"
            # Clear CC to prevent double-prefix (Configure will add prefix automatically)
            unset CC CXX AR RANLIB
            # Remove --strict-warnings to avoid -Werror issues with clang
            STRICT_WARNINGS=""
            echo "Using mingw64 configuration for Windows ARM64 cross-compilation"
          else
            STRICT_WARNINGS="--strict-warnings"
          fi
          
          echo "Configuring ${CONFIG_TARGET} (dynamic)..."
          ./Configure ${CONFIG_TARGET} \
            --prefix=$TONGSUO_HOME \
            --libdir=$TONGSUO_HOME/lib \
            ${STRICT_WARNINGS} --release \
            enable-weak-ssl-ciphers enable-ntls \
            ${CONFIG_ARGS}
          
          echo "Building..."
          make -s -j4
          
          echo "Installing..."
          make install

      # --- Build C Lib (Windows Dynamic) ---
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.platform.target == 'VC-WIN64-ARM' && 'amd64_arm64' || 'amd64' }}
          
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows' && matrix.platform.target == 'VC-WIN64A'
        
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo C Lib (Windows Dynamic)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          
          Write-Host "Configuring ${{ matrix.platform.target }} (dynamic)..."
          perl .\Configure ${{ matrix.platform.target }} `
            --prefix=$Env:TONGSUO_HOME `
            --release no-capieng no-makedepend `
            enable-weak-ssl-ciphers enable-ntls
          
          Write-Host "Building..."
          nmake /S
          
          Write-Host "Installing..."
          nmake install

      # --- Set up runtime library paths ---
      - name: Set PATH for Dynamic Libraries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "$TONGSUO_HOME/bin" >> $GITHUB_PATH
          echo "$TONGSUO_HOME/lib" >> $GITHUB_PATH

      # --- Build Java SDK ---
      - name: Setup Gradle Repository Override
        shell: bash
        run: |
          # Create init.gradle to override repositories with official Maven Central
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITGRADLE'
          allprojects {
            buildscript {
              repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
              }
            }
            repositories {
              google()
              mavenCentral()
            }
          }
          INITGRADLE
          echo "Created Gradle init script to use official repositories"

      - name: Gradle Assemble
        # Skip Java SDK build for Windows ARM64
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          GRADLE_ARGS=""
          GRADLE_CMD="./gradlew"
          
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then 
            GRADLE_ARGS="-Parch=x86_64"
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
          fi
          # Set runtime library paths for dynamic linking
          if [[ "${{ runner.os }}" == "Linux" ]]; then
             export LD_LIBRARY_PATH=$TONGSUO_HOME/lib:$LD_LIBRARY_PATH
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
             export DYLD_LIBRARY_PATH=$TONGSUO_HOME/lib:$DYLD_LIBRARY_PATH
          fi
          
          echo "Running Gradle Assemble..."
          $GRADLE_CMD assemble -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS

      - name: Gradle Test
        # Skip Java SDK build for Windows ARM64
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          GRADLE_ARGS=""
          GRADLE_CMD="./gradlew"
          
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then 
            GRADLE_ARGS="-Parch=x86_64"
            # Run Gradle under Rosetta 2 for x86_64 emulation
            GRADLE_CMD="arch -x86_64 ./gradlew"
            echo "✅ Running tests for macOS x86_64 using Rosetta 2 emulation"
          fi
          # Set runtime library paths for dynamic linking
          if [[ "${{ runner.os }}" == "Linux" ]]; then
             export LD_LIBRARY_PATH=$TONGSUO_HOME/lib:$LD_LIBRARY_PATH
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
             export DYLD_LIBRARY_PATH=$TONGSUO_HOME/lib:$DYLD_LIBRARY_PATH
          fi
          
          echo "Running Gradle Test..."
          $GRADLE_CMD test -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS

          echo "⚠️  Windows ARM64 - C Library Only"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Tongsuo C library built successfully for ARM64"
          echo "❌ Java SDK not built - cross-compilation not supported"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Rename Dynamic JAR
        if: matrix.platform.target != 'VC-WIN64-ARM'
        shell: bash
        run: |
          cd openjdk/build/libs/
          SRC_JAR=$(ls tongsuo-openjdk-*.jar 2>/dev/null | grep -v "sources" | grep -v "javadoc" | head -n 1 || echo "")
          
          if [ -z "$SRC_JAR" ]; then
             echo "Error: Generated JAR not found!"
             ls -la
             exit 1
          fi
          
          # tongsuo-openjdk-dynamic-[version]-[target].jar
          NEW_NAME="tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar"
          
          if [ "$SRC_JAR" != "$NEW_NAME" ]; then
            echo "Renaming $SRC_JAR -> $NEW_NAME"
            mv "$SRC_JAR" "$NEW_NAME"
          else
            echo "JAR already has correct name: $NEW_NAME"
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs-dynamic-${{ matrix.platform.target }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log
          if-no-files-found: ignore

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-dynamic-${{ matrix.platform.target }}
          path: openjdk/build/libs/tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar
          retention-days: 1

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: success() && matrix.platform.target != 'VC-WIN64-ARM'
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
          files: openjdk/build/libs/tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar
          fail_on_unmatched_files: true
  # ==================================================================================
  # Phase 4: Build Uber JAR (All Platforms)
  # ==================================================================================
  build-uber-jar:
    name: Build Uber JAR
    needs: build-dynamic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 11

      - name: Create Uber JAR Directory
        run: |
          mkdir -p uber-jar-work
          cd uber-jar-work
          mkdir -p native-libs
          mkdir -p META-INF

      - name: Download Linux x64 Dynamic JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-dynamic-linux-x86_64
          path: uber-jar-work/jars/

      - name: Download Linux ARM64 Dynamic JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-dynamic-linux-aarch64
          path: uber-jar-work/jars/

      - name: Download macOS x64 Dynamic JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-dynamic-darwin64-x86_64
          path: uber-jar-work/jars/

      - name: Download macOS ARM64 Dynamic JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-dynamic-darwin64-arm64
          path: uber-jar-work/jars/

      - name: Download Windows x64 Dynamic JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-dynamic-VC-WIN64A
          path: uber-jar-work/jars/

      - name: Download Windows ARM64 Dynamic JAR
        uses: actions/download-artifact@v7
        with:
          name: jar-dynamic-VC-WIN64-ARM
          path: uber-jar-work/jars/

      - name: Extract and Merge Native Libraries
        run: |
          cd uber-jar-work
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Building Uber JAR - All Platforms Dynamic"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Extract first JAR to get the base structure
          FIRST_JAR=$(ls jars/*.jar | head -1)
          echo "Using $FIRST_JAR as base..."
          unzip -q "$FIRST_JAR" -d base/
          
          # Extract native libraries from all JARs
          for jar in jars/*.jar; do
            echo "Extracting native libraries from $(basename $jar)..."
            unzip -q "$jar" "org/conscrypt/native/*" -d temp/ 2>/dev/null || true
            if [ -d temp/org/conscrypt/native ]; then
              cp -r temp/org/conscrypt/native/* base/org/conscrypt/native/ 2>/dev/null || true
              rm -rf temp
            fi
          done
          
          # List all included native libraries
          echo ""
          echo "Included native libraries:"
          find base/org/conscrypt/native -type f | sort
          
          # Create uber JAR
          echo ""
          echo "Creating uber JAR..."
          cd base
          jar cf ../tongsuo-openjdk-${{ inputs.version }}-uber.jar .
          cd ..
          
          # Show JAR info
          echo ""
          echo "Uber JAR created:"
          ls -lh tongsuo-openjdk-${{ inputs.version }}-uber.jar
          echo ""
          echo "Contents:"
          jar tf tongsuo-openjdk-${{ inputs.version }}-uber.jar | grep "org/conscrypt/native" | sort

      - name: Verify Uber JAR
        run: |
          cd uber-jar-work
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Uber JAR Verification"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Count platforms
          LINUX_COUNT=$(jar tf tongsuo-openjdk-${{ inputs.version }}-uber.jar | grep -c "linux" || echo 0)
          DARWIN_COUNT=$(jar tf tongsuo-openjdk-${{ inputs.version }}-uber.jar | grep -c "darwin\|osx" || echo 0)
          WINDOWS_COUNT=$(jar tf tongsuo-openjdk-${{ inputs.version }}-uber.jar | grep -c "windows\|win" || echo 0)
          
          echo "Platform Coverage:"
          echo "  Linux libraries:   $LINUX_COUNT"
          echo "  macOS libraries:   $DARWIN_COUNT"
          echo "  Windows libraries: $WINDOWS_COUNT"
          echo ""
          
          # Expected minimum (may vary)
          EXPECTED_MIN=4
          TOTAL=$((LINUX_COUNT + DARWIN_COUNT + WINDOWS_COUNT))
          
          echo "Total native libraries: $TOTAL"
          echo "Expected minimum: $EXPECTED_MIN"
          
          if [ $TOTAL -ge $EXPECTED_MIN ]; then
            echo "✅ Verification passed!"
          else
            echo "⚠️  Warning: Found fewer libraries than expected"
            echo "This might be OK if some platforms were skipped"
          fi

      - name: Upload Uber JAR Artifact
        uses: actions/upload-artifact@v6
        with:
          name: jar-uber
          path: uber-jar-work/tongsuo-openjdk-${{ inputs.version }}-uber.jar
          retention-days: 7

      - name: Upload Uber JAR to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
          files: uber-jar-work/tongsuo-openjdk-${{ inputs.version }}-uber.jar
          fail_on_unmatched_files: true
          body: |
            ## 📦 Uber JAR
            
            This is a multi-platform JAR containing native libraries for:
            - ✅ Linux x64
            - ✅ Linux ARM64
            - ✅ macOS x64
            - ✅ macOS ARM64
            - ✅ Windows x64
            - ✅ Windows ARM64
            
            **Usage:**
            ```xml
            <dependency>
                <groupId>net.tongsuo</groupId>
                <artifactId>tongsuo-openjdk</artifactId>
                <version>${{ inputs.version }}</version>
                <classifier>uber</classifier>
            </dependency>
            ```
            
            **Note:** This JAR works on all supported platforms without platform-specific classifiers.
