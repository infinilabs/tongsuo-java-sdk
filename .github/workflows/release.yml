name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to build (e.g., 1.1.0)'
        required: true
        default: '1.1.0'

permissions:
  contents: write

env:
  TONGSUO_VERSION: 8.4-stable

jobs:
  # ==================================================================================
  # Phase 1: Prepare Source Code
  # ==================================================================================
  clone_tongsuo:
    name: Prepare Source
    runs-on: ubuntu-latest
    steps:
      - name: Clone Tongsuo Repository
        uses: actions/checkout@v4
        with:
          repository: Tongsuo-Project/Tongsuo
          ref: ${{ env.TONGSUO_VERSION }}
          path: Tongsuo

      - name: Archive Tongsuo Source
        uses: actions/upload-artifact@v4
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo

  # ==================================================================================
  # Phase 2: Build Static Library
  # ==================================================================================
  build-static:
    name: Static - ${{ matrix.platform.target }}
    needs: clone_tongsuo
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04,     target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-14,         target: darwin64-x86_64 }
          - { os: macos-14,         target: darwin64-arm64 }
          - { os: windows-latest,   target: VC-WIN64A }
          - { os: windows-latest,   target: VC-WIN64-ARM }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45

    steps:
      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV
          
          # Cross-compilation flags for macOS x86_64 on ARM runners
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
             echo "CC=clang -arch x86_64" >> $GITHUB_ENV
             echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
             echo "Configuring cross-compilation for x86_64..."
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11

      - uses: actions/checkout@v4

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v4
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo

      # --- Build C Lib (Unix) ---
      - name: Build Tongsuo C Lib (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          
          echo "Configuring ${{ matrix.platform.target }}..."
          ./Configure ${{ matrix.platform.target }} \
            --prefix=$TONGSUO_HOME \
            --libdir=$TONGSUO_HOME/lib \
            --strict-warnings --release -fstack-protector-strong \
            enable-weak-ssl-ciphers enable-ntls no-shared > configure.log 2>&1
          
          make -s -j4 > build.log 2>&1
          make install >> build.log 2>&1

      # --- Build C Lib (Windows) ---
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo C Lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          perl .\Configure ${{ matrix.platform.target }} --prefix=$Env:TONGSUO_HOME --release no-capieng no-makedepend enable-weak-ssl-ciphers enable-ntls no-shared
          nmake /S
          nmake install

      # --- Build Java SDK ---
      - name: Gradle Assemble
        shell: bash
        run: |
          GRADLE_ARGS=""
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then GRADLE_ARGS="-Parch=x86_64"; fi
          
          echo "Building JAR..."
          ./gradlew assemble -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS > gradle_build.log 2>&1

      - name: Gradle Test
        shell: bash
        run: |
          GRADLE_ARGS=""
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then GRADLE_ARGS="-Parch=x86_64"; fi
          
          # Add Tongsuo bin/lib to PATH for Windows tests
          if [[ "${{ runner.os }}" == "Windows" ]]; then
             export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
          fi
          
          ./gradlew test -PcheckErrorQueue -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS > gradle_test.log 2>&1

      - name: Rename Static JAR
        shell: bash
        run: |
          cd openjdk/build/libs/
          SRC_JAR=$(ls tongsuo-openjdk-*.jar | grep -v "sources" | grep -v "javadoc" | head -n 1)
          
          if [ -f "$SRC_JAR" ]; then
             NEW_NAME="tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar"
             echo "Renaming $SRC_JAR -> $NEW_NAME"
             mv "$SRC_JAR" "$NEW_NAME"
          else
             echo "Error: Generated JAR not found!"
             exit 1
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-static-${{ matrix.platform.target }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-static-${{ matrix.platform.target }}
          path: openjdk/build/libs/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
          files: openjdk/build/libs/tongsuo-openjdk-${{ inputs.version }}-${{ matrix.platform.target }}.jar

  # ==================================================================================
  # Phase 3: Build Dynamic Library
  # ==================================================================================
  build-dynamic:
    name: Dynamic - ${{ matrix.platform.target }}
    needs: clone_tongsuo
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-24.04,     target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-14,         target: darwin64-x86_64 }
          - { os: macos-14,         target: darwin64-arm64 }
          - { os: windows-latest,   target: VC-WIN64A }
          - { os: windows-latest,   target: VC-WIN64-ARM }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 45

    steps:
      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "TONGSUO_HOME=${{ runner.temp }}/tongsuo" >> $GITHUB_ENV
          if [[ "${{ runner.os }}" == "macOS" && "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then
             echo "CC=clang -arch x86_64" >> $GITHUB_ENV
             echo "CXX=clang++ -arch x86_64" >> $GITHUB_ENV
          fi

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 11

      - uses: actions/checkout@v4

      - name: Download Tongsuo Source
        uses: actions/download-artifact@v4
        with:
          name: tongsuo-src
          path: ${{ github.workspace }}/Tongsuo

      # --- Build C Lib (Dynamic) ---
      - name: Build Tongsuo C Lib (Unix Dynamic)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ${{ github.workspace }}/Tongsuo
          mkdir -p $TONGSUO_HOME
          # No 'no-shared'
          ./Configure ${{ matrix.platform.target }} \
            --prefix=$TONGSUO_HOME \
            --libdir=$TONGSUO_HOME/lib \
            --strict-warnings --release \
            enable-weak-ssl-ciphers enable-ntls > configure.log 2>&1
          make -s -j4 > build.log 2>&1
          make install >> build.log 2>&1

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'
      - uses: shogo82148/actions-setup-perl@v1
        if: runner.os == 'Windows'

      - name: Build Tongsuo C Lib (Windows Dynamic)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd ${{ github.workspace }}\Tongsuo
          perl .\Configure ${{ matrix.platform.target }} --prefix=$Env:TONGSUO_HOME --release no-capieng no-makedepend enable-weak-ssl-ciphers enable-ntls
          nmake /S
          nmake install

      # --- Build Java SDK ---
      - name: Gradle Assemble & Test
        shell: bash
        run: |
          GRADLE_ARGS=""
          if [[ "${{ matrix.platform.target }}" == "darwin64-x86_64" ]]; then GRADLE_ARGS="-Parch=x86_64"; fi
          
          # Set runtime library paths for dynamic linking
          if [[ "${{ runner.os }}" == "Linux" ]]; then
             export LD_LIBRARY_PATH=$TONGSUO_HOME/lib:$LD_LIBRARY_PATH
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
             export DYLD_LIBRARY_PATH=$TONGSUO_HOME/lib:$DYLD_LIBRARY_PATH
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
             export PATH=$TONGSUO_HOME/bin:$TONGSUO_HOME/lib:$PATH
          fi
          
          echo "Running Gradle Assemble..."
          ./gradlew assemble -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS > gradle_build.log 2>&1
          
          echo "Running Gradle Test..."
          ./gradlew test -PcheckErrorQueue -PtongsuoDynamic=1 -PtongsuoHome=$TONGSUO_HOME $GRADLE_ARGS > gradle_test.log 2>&1

      - name: Rename Dynamic JAR
        shell: bash
        run: |
          cd openjdk/build/libs/
          SRC_JAR=$(ls tongsuo-openjdk-*.jar | grep -v "sources" | grep -v "javadoc" | head -n 1)
          
          if [ -f "$SRC_JAR" ]; then
             # 强制命名格式：tongsuo-openjdk-dynamic-[version]-[target].jar
             NEW_NAME="tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar"
             echo "Renaming $SRC_JAR -> $NEW_NAME"
             mv "$SRC_JAR" "$NEW_NAME"
          else
             echo "Error: Generated JAR not found!"
             exit 1
          fi

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-dynamic-${{ matrix.platform.target }}
          path: |
            ${{ github.workspace }}/Tongsuo/*.log
            *.log

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-dynamic-${{ matrix.platform.target }}
          path: openjdk/build/libs/tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
          files: openjdk/build/libs/tongsuo-openjdk-dynamic-${{ inputs.version }}-${{ matrix.platform.target }}.jar