apply plugin: 'maven-publish'
apply plugin: 'signing'

def isSnapshot = project.version.contains('SNAPSHOT')

publishing {
    publications {
        maven(MavenPublication) {
            pom {
                afterEvaluate {
                    name = "$project.group:$project.name" as String
                    description = project.description
                }

                url = project.findProperty('mavenProjectUrl') ?: 'https://www.tongsuo.net/'

                scm {
                    def scmUrl = project.findProperty('mavenScmUrl') ?: 'https://github.com/Tongsuo-Project/tongsuo-java-sdk'
                    connection = "scm:git:${scmUrl}.git"
                    developerConnection = "scm:git:git@github.com:${scmUrl.replaceFirst('https://github.com/', '')}.git"
                    url = scmUrl
                }

                licenses {
                    license {
                        name = 'Apache 2'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0'
                    }
                }

                developers {
                    developer {
                        id = project.findProperty('mavenDeveloperId') ?: 'tongsuo'
                        name = project.findProperty('mavenDeveloperName') ?: 'Tongsuo Project Authors'
                        email = project.findProperty('mavenDeveloperEmail') ?: 'tongsuo-dev@tongsuo.net'
                        url = project.findProperty('mavenDeveloperUrl') ?: 'https://www.tongsuo.net/'
                        organization = project.findProperty('mavenOrganization') ?: 'Tongsuo Project'
                        organizationUrl = project.findProperty('mavenOrganizationUrl') ?: 'https://github.com/Tongsuo-Project'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            def snapshotUrl = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
            def stagingUrl = rootProject.hasProperty('repositoryId') ? \
                'https://s01.oss.sonatype.org/service/local/staging/deployByRepositoryId/' \
                    + rootProject.repositoryId : \
                'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
            url isSnapshot ? snapshotUrl : stagingUrl
            credentials {
                username = rootProject.findProperty('ossrhUsername') ?: ''
                password = rootProject.findProperty('ossrhPassword') ?: ''
            }
        }
    }
}

signing {
    sign publishing.publications.maven
}

signMavenPublication.doFirst {
    publishing.publications.maven.artifacts.each {
        if (it.file.absolutePath.endsWith('.jar') && it.classifier != 'sources' && it.classifier != 'javadoc') {
            logger.info("Signing jar: ${it.file.absolutePath}")
            signJar(it.file.absolutePath)
        }
   }
}
